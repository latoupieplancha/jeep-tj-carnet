<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet d'entretien — Jeep TJ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#F4F1E9;
  --panel:#FFFFFF;
  --panel-raised:#EFEAE0;
  --line:#DCD5C4;
  --brass:#9C7A1E;
  --brass-dim:#9C7A1E40;
  --rust:#B14A2B;
  --ok:#4C7A4C;
  --warn:#A9800F;
  --danger:#B14A2B;
  --text:#2A2A28;
  --text-dim:#6B675C;
  --mono:'JetBrains Mono',monospace;
  --disp:'Oswald',sans-serif;
  --body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% -10%, #FFFDF7 0%, transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:var(--body);
  padding-bottom:60px;
}
.plate{
  background:linear-gradient(180deg,#FBF8F0,#F0EBDD);
  border-bottom:3px solid var(--brass);
  padding:22px 20px 18px;
  position:relative;
}
.plate::after{
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(45deg, rgba(0,0,0,0.012) 0 2px, transparent 2px 6px);
  pointer-events:none;
}
.plate-eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:3px;
  color:var(--brass);
  text-transform:uppercase;
}
.plate-title{
  font-family:var(--disp);
  font-size:26px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
  margin:2px 0 10px;
}
.plate-specs{
  display:flex;
  flex-wrap:wrap;
  gap:6px 16px;
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--text-dim);
}
.odo-row{
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.odo-label{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:2px;
  color:var(--text-dim);
  text-transform:uppercase;
}
.odo-display{
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px 14px;
  font-family:var(--mono);
  font-size:22px;
  font-weight:700;
  letter-spacing:3px;
  color:var(--brass);
  display:flex;
  align-items:center;
  gap:6px;
}
.odo-display input{
  background:transparent;
  border:none;
  color:var(--brass);
  font-family:var(--mono);
  font-size:22px;
  font-weight:700;
  letter-spacing:3px;
  width:110px;
  outline:none;
}
.odo-display span{opacity:.6; font-size:14px;}

.plate-stats{
  margin-top:14px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.plate-stat{
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px 12px;
  min-width:150px;
}
.plate-stat-label{
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:3px;
}
.plate-stat-value{
  font-family:var(--disp);
  font-size:19px;
  font-weight:600;
  color:var(--brass);
}
.plate-stat-sub{
  font-family:var(--mono);
  font-size:10px;
  color:var(--text-dim);
  margin-top:2px;
}

.tab-bar{
  display:flex;
  gap:8px;
  max-width:720px;
  margin:0 auto;
  padding:14px 18px 0;
}
.tab-btn{
  flex:1;
  font-family:var(--disp);
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  padding:10px 8px;
  color:var(--text-dim);
  cursor:pointer;
}
.tab-btn.active{
  background:var(--brass);
  border-color:var(--brass);
  color:#FFFFFF;
}

.section{
  padding:24px 18px 4px;
  max-width:720px;
  margin:0 auto;
}
.section-title{
  font-family:var(--disp);
  font-size:15px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-dim);
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
  margin-bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.section-title small{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:0;
  color:var(--text-dim);
}

.cards{display:flex; flex-direction:column; gap:10px;}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--line);
  border-radius:6px;
  padding:12px 14px;
}
.card.ok{border-left-color:var(--ok);}
.card.warn{border-left-color:var(--warn);}
.card.danger{border-left-color:var(--danger);}
.card.unknown{border-left-color:var(--text-dim);}
.card.estimated{border-left-color:#4A8FC2;}
.card-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}
.card-name{font-family:var(--disp); font-size:15px; letter-spacing:.5px;}
.card-status{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:3px;
  white-space:nowrap;
}
.card.ok .card-status{background:#5C8A5C25; color:var(--ok);}
.card.warn .card-status{background:#C9A22725; color:var(--warn);}
.card.danger .card-status{background:#C1502E25; color:var(--danger);}
.card.unknown .card-status{background:#9AA0AC25; color:var(--text-dim);}
.card.estimated .card-status{background:#4A8FC225; color:#4A8FC2;}
.card-meta{
  font-family:var(--mono);
  font-size:11px;
  color:var(--text-dim);
  margin-top:6px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.bar{
  height:5px;
  background:#E4DDCC;
  border-radius:3px;
  margin-top:9px;
  overflow:hidden;
}
.bar-fill{height:100%; border-radius:3px;}
.card.ok .bar-fill{background:var(--ok);}
.card.warn .bar-fill{background:var(--warn);}
.card.danger .bar-fill{background:var(--danger);}
.card.unknown .bar-fill{background:var(--text-dim);}
.card.estimated .bar-fill{background:#4A8FC2;}
.card.priorite_haute{border-left-color:var(--danger);}
.card.priorite_haute .card-status{background:#C1502E25; color:var(--danger);}
.card.priorite_moyenne{border-left-color:var(--warn);}
.card.priorite_moyenne .card-status{background:#C9A22725; color:var(--warn);}
.card.priorite_basse{border-left-color:var(--ok);}
.card.priorite_basse .card-status{background:#5C8A5C25; color:var(--ok);}
.card-actions{margin-top:9px; display:flex; gap:8px;}

button{
  font-family:var(--body);
  font-weight:600;
  font-size:12.5px;
  border-radius:5px;
  border:1px solid var(--line);
  background:var(--panel-raised);
  color:var(--text);
  padding:7px 12px;
  cursor:pointer;
}
button:hover{border-color:var(--brass-dim);}
button.primary{
  background:var(--brass);
  color:#FFFDF7;
  border-color:var(--brass);
}
button.primary:hover{filter:brightness(1.08);}
button.ghost{background:transparent; color:var(--text-dim); border-color:transparent; padding:6px 4px;}
button.small{padding:5px 9px; font-size:11.5px;}

.log-entry{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.log-entry:last-child{border-bottom:none;}
.log-left{display:flex; flex-direction:column; gap:2px;}
.log-type{font-family:var(--disp); font-size:14px;}
.log-sub{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
.log-cost{font-family:var(--mono); font-size:13px; color:var(--brass); white-space:nowrap;}
.log-notes{font-size:11.5px; color:var(--text-dim); margin-top:2px; max-width:320px;}

.empty{
  color:var(--text-dim);
  font-size:13px;
  padding:20px 0;
  text-align:center;
  font-style:italic;
}

.fab-add{
  display:block;
  width:100%;
  margin-top:14px;
  padding:12px;
  text-align:center;
}

.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,11,13,0.72);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:50;
}
.modal{
  background:var(--panel);
  border:1px solid var(--line);
  border-top:3px solid var(--brass);
  border-radius:12px 12px 0 0;
  width:100%; max-width:520px;
  padding:20px 18px 24px;
  max-height:88vh;
  overflow-y:auto;
}
.modal h3{
  font-family:var(--disp);
  font-size:17px;
  letter-spacing:.5px;
  margin:0 0 14px;
  text-transform:uppercase;
}
.field{margin-bottom:12px;}
.field label{
  display:block;
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:5px;
}
.field input, .field select, .field textarea{
  width:100%;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:5px;
  color:var(--text);
  padding:9px 10px;
  font-family:var(--body);
  font-size:14px;
  outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brass);}
.field textarea{resize:vertical; min-height:50px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex; gap:10px; margin-top:16px;}
.modal-actions button{flex:1; padding:11px;}

.settings-toggle{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-dim);
  background:none;
  border:none;
  text-decoration:underline;
  cursor:pointer;
  padding:0;
}
.interval-edit{
  display:flex;
  gap:8px;
  margin-top:8px;
  align-items:center;
}
.interval-edit input{width:70px;}

.loading{text-align:center; padding:40px; color:var(--text-dim); font-family:var(--mono); font-size:12px;}
</style>
</head>
<body>

<div class="plate">
  <div class="plate-eyebrow">Carnet d'entretien</div>
  <div class="plate-title">Jeep Wrangler TJ Sahara</div>
  <div class="plate-specs">
    <span>4.0L I6</span>
    <span>1998 · Automatique (32RH)</span>
    <span>VIN 1J4FYA9S0VP531754</span>
    <span>Immat. EJ-475-JK</span>
  </div>
  <div class="odo-row">
    <span class="odo-label">Kilométrage actuel</span>
    <div class="odo-display">
      <input id="odoInput" type="number" inputmode="numeric" placeholder="——————">
      <span>km</span>
    </div>
    <button class="small" id="saveOdoBtn">Mettre à jour</button>
  </div>
  <div id="plateStats" class="plate-stats"></div>
</div>

<div class="tab-bar">
  <button class="tab-btn" id="tabCarnetBtn" onclick="switchTab('carnet')">📋 Carnet</button>
  <button class="tab-btn" id="tabFuelBtn" onclick="switchTab('carburant')">⛽ Carburant</button>
</div>

<div id="app" class="section">
  <div class="loading">Chargement du carnet…</div>
</div>

<div id="modalRoot"></div>

<script>

  { id:'dir_assistee', name:'Liquide de direction assistée (MS-5931/MS-9602)', intervalKm:160000, intervalMonths:60 },

  { id:'courroie',   name:'Courroie accessoires',              intervalKm:60000, intervalMonths:60 },
  { id:'silent_blocs', name:'Contrôle silent blocs / train roulant', intervalKm:null, intervalMonths:12 },
  { id:'echappement', name:'Échappement (ligne complète)',     intervalKm:null,  intervalMonths:null },
  { id:'cession',    name:'Cession / Immatriculation',          intervalKm:null,  intervalMonths:null },

let state = {
  currentMileage: 97785,
  types: DEFAULT_TYPES,
  entries: [
    { id:'e_ct_20251021', typeId:'ct', typeName:'Contrôle technique', date:'2025-10-21', mileage:94643, cost:null, notes:"CT initial DÉFAVORABLE (majeures) — Auto Bilan Canaulais / Norisko, PV n°25036829. Majeures : plaques d'immatriculation non conformes (AV, AR) ; numéro d'identification/VIN manquant ou introuvable. Mineures : freins AR déséquilibrés (22%), essuie-glaces AR/AVD défectueux, éclairage plaque AR, pneus usure anormale (4 roues), amortisseurs AV asymétrie 32%, sièges AR absents lors du contrôle. Ripage +0,7 m/km (excellent). Limite de validité contre-visite : 20/12/2025." },
    { id:'e_ct_20251215', typeId:'ct', typeName:'Contrôle technique', date:'2025-12-15', mileage:94987, cost:1184.58, notes:"Contre-visite FAVORABLE — facture Alex Garage-Méca n°4823 (17/12/2025, réglée 1200€ en espèces par la venderesse le 30/01/2026). Travaux : 2 plaques d'immatriculation neuves, frappe du numéro de série (150€), forfait peinture aile AVG (250€), poignée levier de vitesse, balais essuie-glace (AVD/AVG/AR), vidange huile 0W30, contrôle technique (64€)." },
    { id:'e_vidange_20251215', typeId:'vidange', typeName:'Vidange moteur (huile + filtre)', date:'2025-12-15', mileage:94987, cost:null, notes:"Huile 0W30 — inclus dans facture Alex Garage-Méca n°4823." },
    { id:'e_echap_20250318', typeId:'echappement', typeName:'Échappement (ligne complète)', date:'2025-03-18', mileage:92657, cost:768.11, notes:"Remplacement ligne complète (2 silencieux + colliers AV/AR + silentbloc AR) — facture Alex Garage-Méca n°3880." },
    { id:'e_ct_20260813', typeId:'ct', typeName:'Contrôle technique', date:'2026-08-13', mileage:97502, cost:null, notes:"Nouveau CT (obtenu pour la vente) DÉFAVORABLE (majeures) — SARL Sodex Autocentre Contrôle, Lacanau, PV n°26059337. Majeures : efficacité du frein de service insuffisante (taux global 47%, seuil ≥50%) ; efficacité du frein de stationnement insuffisante (14%, seuil ≥18%) ; orientation du feu de croisement AVD hors tolérance. Mineures : mauvaise fixation feu de détresse AVG, pneus usure anormale (AVG/ARD/AVD/ARG), sièges AR absents lors du contrôle. Ripage +3,1 m/km. Limite de validité contre-visite : 12/10/2026." },
    { id:'e_ct_20260820', typeId:'ct', typeName:'Contrôle technique', date:'2026-08-20', mileage:97719, cost:null, notes:"Contre-visite FAVORABLE — Securitest Blanquefort, PV n°26030003. Valable jusqu'au 19/08/2028 (prochain contrôle : périodique normal). Freins corrigés : efficacité globale 51% (≥50% requis), frein de stationnement 20% (≥18% requis). Défaillances mineures résiduelles : jeu direction AVG, balai essuie-glace AVG, fixation feu détresse AVG, éclairage plaque AR, pneus AVD/ARD/ARG, corrosion châssis AVG/ARG, sièges AR absents lors du contrôle. Ripage +2,4 m/km." },
    { id:'e_cession_20260820', typeId:'cession', typeName:'Cession / Immatriculation', date:'2026-08-20', mileage:97785, cost:null, notes:"Certificat de cession signé à Lacanau, 15h15 — cédante Agnès Brande (12 lot Green Parc, 33680 Lacanau Océan), acquéreur Jean-François Morette (8 allée Beau Pré, 33650 Saucats). Certificat de situation administrative (non-gage) du 20/08/2026 : RAS — aucune opposition, aucun gage, véhicule non volé, immatriculation non volée/perdue/annulée." }
  ],
  reminders: [
    { id:'r_pneus', label:'Remplacement pneus 31x10.50R15', status:'priorite_haute', date:null, notes:"Recommandation actuelle : Hankook Dynapro AT2 Xtreme RF12 (~135€/unité, indice adhérence pluie UE A, certifié hiver 3PMSF) — préféré au BFGoodrich KO2 (adhérence pluie B, ~249€/unité) vu le profil d'usage 90% route/pluie. Le KO3 n'est pas disponible dans cette taille en France. À prévoir avec le contrôle géométrie/parallélisme." },
    { id:'r_amortisseurs_av', label:'Amortisseurs avant', status:'priorite_haute', date:null, notes:"Asymétrie de 32% relevée au CT, possiblement liée à un choc avant antérieur. À faire diagnostiquer et remplacer par Aquitaine 4X4 ou Jungle's 4x4." },
    { id:'r_freins_ar', label:'Freinage arrière', status:'priorite_haute', date:null, notes:"Déséquilibre de 22% relevé au CT. À faire vérifier/corriger." },
    { id:'r_carte_grise', label:'Transfert carte grise', status:'priorite_haute', date:null, notes:"À vérifier si la démarche a déjà été effectuée suite à l'achat du 20/08/2026." },
    { id:'r_dreal', label:'Attestation DREAL (frappe VIN)', status:'priorite_haute', date:null, notes:"À vérifier si l'autorisation DREAL préalable à la frappe du numéro de série a bien été obtenue formellement (frappe déjà réalisée lors de la contre-visite du 17/12/2025)." },
    { id:'r_vitre_conducteur', label:"Vitre conducteur (ne descend pas complètement)", status:'priorite_moyenne', date:null, notes:"Câble de lève-vitre, glissière ou moteur en cause probable. Non urgent en été mais à résoudre avant l'automne/hiver." },
    { id:'r_eclairage_plaque', label:"Éclairage plaque d'immatriculation AR", status:'priorite_moyenne', date:null, notes:"Ampoule W5W/T10 12V 5W — douille cassée, capuchon métallique bloqué. Défaillance mineure relevée au CT." },
    { id:'r_liquide_refroid', label:'Vidange liquide de refroidissement', status:'priorite_moyenne', date:null, notes:"Capacité 9,9 L (FSM). Circuit probablement IAT (vert/jaune, pré-OAT). Avant intervention : vérifier la couleur dans le vase d'expansion — clair (vert/jaune) → remplacer même famille IAT ; trouble/marron → rinçage complet du circuit nécessaire. Ne jamais mélanger IAT/HOAT/OAT. Acheter prêt à l'emploi chez Feu Vert (deux bidons de 5L). À déléguer au garagiste." },
    { id:'r_geometrie', label:'Contrôle géométrie / parallélisme', status:'priorite_moyenne', date:null, notes:"À faire après le remplacement des pneus." },
    { id:'r_boite_transfert', label:'Vidange boîte de transfert NP231', status:'priorite_basse', date:null, notes:"Huile ATF+4, coût faible (~50–90€). Peut être groupée avec un autre rendez-vous." },
    { id:'r_pare_choc_av', label:'Pare-choc avant (angle droit endommagé)', status:'priorite_basse', date:null, notes:"Rayures profondes jusqu'au matériau brut, léger enfoncement près du clignotant + éclats de peinture près du loquet de capot. Estimation : 350–650€ si réparable, 500–900€ si remplacement nécessaire." },
    { id:'r_attelage', label:"Attelage", status:'priorite_basse', date:null, notes:"Attelage boule fixe homologué européen (R55/ECE + directive 94/20/CE), GDW/Boisnier pour TJ 10/1996–03/2007. Faisceau multiplexé 7 broches nécessaire." },

// Calcule le rythme de conduite moyen (km/mois) à partir de l'historique de relevés
function computeMonthlyRate(){
  const hist = [...(state.mileageHistory||[])].sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(hist.length < 2) return null;
  const first = hist[0], last = hist[hist.length-1];
  const monthsSpan = daysBetween(new Date(first.date), new Date(last.date)) / 30.44;
  if(monthsSpan < 1) return null; // pas assez de recul pour un rythme fiable
  const kmSpan = last.mileage - first.mileage;
  if(kmSpan <= 0) return null;
  return kmSpan / monthsSpan;
}

function lastMileageReportDate(){
  const hist = [...(state.mileageHistory||[])].sort((a,b)=> new Date(b.date)-new Date(a.date));
  return hist[0] ? new Date(hist[0].date) : null;
}

// Km parcourus entre les deux derniers relevés enregistrés (≈ le mois précédent, au rythme des relevés mensuels)
function kmSinceLastPeriod(){
  const hist = [...(state.mileageHistory||[])].sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(hist.length < 2) return null;
  const last = hist[hist.length-1], prev = hist[hist.length-2];
  return { km: last.mileage - prev.mileage, from: prev.date, to: last.date };
}

function kmSincePurchase(){
  if(state.currentMileage==null) return null;
  return state.currentMileage - PURCHASE_MILEAGE;
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed, types: parsed.types || DEFAULT_TYPES };
    }
  }catch(e){
    console.error('Erreur de chargement', e);
    showStorageWarning();
  }
  // Migration : tout rappel existant sans statut est considéré "estimé"
  state.reminders = (state.reminders||[]).map(r=> ({ status:'estime', ...r }));
  state.fuelEntries = state.fuelEntries || [];
  render();
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Erreur de sauvegarde', e);
    showStorageWarning();
  }
}

function showStorageWarning(){
  if(document.getElementById('storageWarning')) return;
  const div = document.createElement('div');
  div.id = 'storageWarning';
  div.style.cssText = 'position:fixed; bottom:0; left:0; right:0; background:#B14A2B; color:#fff; padding:10px 14px; font-family:sans-serif; font-size:12.5px; z-index:999; text-align:center;';
  div.innerHTML = "⚠️ Impossible d'enregistrer localement (navigation privée, cookies bloqués ou stockage plein). Pense à exporter ta sauvegarde régulièrement.";
  document.body.appendChild(div);
}

function daysBetween(a,b){ return Math.round((b-a)/86400000); }

function computeStatus(type){
  const lastEntries = state.entries
    .filter(e=>e.typeId===type.id)
    .sort((a,b)=> new Date(b.date)-new Date(a.date));
  const last = lastEntries[0] || null;

  let kmRemaining = null, nextDueKm = null, monthsInfo = null, projectedDate = null, ratio = 0, unknown = false, estimated = false;

  if(type.intervalKm && state.currentMileage!=null){
    if(last && last.mileage!=null){
      nextDueKm = last.mileage + type.intervalKm;
      kmRemaining = nextDueKm - state.currentMileage;
      const used = state.currentMileage - last.mileage;
      ratio = Math.max(ratio, used / type.intervalKm);
    } else {
      // Pas d'historique : on estime la prochaine échéance depuis le kilométrage actuel (achat du véhicule)
      nextDueKm = state.currentMileage + type.intervalKm;
      kmRemaining = type.intervalKm;
      estimated = true;
    }
    // Projection de la date d'échéance à partir du rythme de conduite réel (km/mois)
    const rate = computeMonthlyRate();
    if(rate && kmRemaining!=null){
      const monthsToGo = Math.max(kmRemaining, 0) / rate;
      const d = new Date();
      d.setDate(d.getDate() + Math.round(monthsToGo*30.44));
      projectedDate = d;
    }
  } else if(type.intervalKm && state.currentMileage==null){
    unknown = true;
  }

  if(type.intervalMonths){
    if(last){
      const lastDate = new Date(last.date);
      const dueDate = new Date(lastDate);
      dueDate.setMonth(dueDate.getMonth()+type.intervalMonths);
      const today = new Date();
      const totalDays = daysBetween(lastDate, dueDate);
      const usedDays = daysBetween(lastDate, today);
      monthsInfo = { dueDate, daysRemaining: daysBetween(today, dueDate) };
      ratio = Math.max(ratio, usedDays/totalDays);
    } else {
      // Pas d'historique : on estime depuis aujourd'hui (date d'achat)
      const today = new Date();
      const dueDate = new Date(today);
      dueDate.setMonth(dueDate.getMonth()+type.intervalMonths);
      monthsInfo = { dueDate, daysRemaining: daysBetween(today, dueDate) };
      estimated = true;
    }
  }

  let level = 'ok';
  if(unknown) level = 'unknown';
  else if(estimated) level = 'estimated';
  else if(ratio >= 1) level = 'danger';
  else if(ratio >= 0.8) level = 'warn';

  return { last, kmRemaining, nextDueKm, monthsInfo, projectedDate, ratio: Math.min(ratio,1), level, estimated };
}

function fmtDate(d){
  return new Date(d).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtKm(n){ return n==null? '—' : n.toLocaleString('fr-FR')+' km'; }

function fuelStats(){
  const entries = [...(state.fuelEntries||[])]
    .filter(e=> e.mileage!=null && e.liters!=null)
    .sort((a,b)=> a.mileage-b.mileage);
  if(entries.length<2) return null;
  const totalLiters = entries.slice(1).reduce((sum,e)=> sum + e.liters, 0);
  const totalKm = entries[entries.length-1].mileage - entries[0].mileage;
  if(totalKm<=0) return null;
  const avgConso = totalLiters / totalKm * 100;
  const prev = entries[entries.length-2];
  const last = entries[entries.length-1];
  const lastKm = last.mileage - prev.mileage;
  const lastConso = lastKm>0 ? (last.liters/lastKm*100) : null;
  return { avgConso, lastConso, totalLiters, totalKm, count: entries.length };
}

function fuelConsoForEntry(entry, sortedByMileage){
  const idx = sortedByMileage.findIndex(e=>e.id===entry.id);
  if(idx<=0) return null;
  const prev = sortedByMileage[idx-1];
  if(entry.mileage==null || prev.mileage==null || entry.liters==null) return null;
  const km = entry.mileage - prev.mileage;
  if(km<=0) return null;
  return entry.liters / km * 100;
}

function render(){
  const app = document.getElementById('app');
  document.getElementById('odoInput').value = state.currentMileage ?? '';

  document.getElementById('tabCarnetBtn').classList.toggle('active', currentTab==='carnet');
  document.getElementById('tabFuelBtn').classList.toggle('active', currentTab==='carburant');

  // Stats du bandeau : km depuis le dernier relevé, km depuis l'achat, consommation moyenne
  const lastPeriod = kmSinceLastPeriod();
  const sincePurchase = kmSincePurchase();
  const fStats = fuelStats();
  const plateStatsEl = document.getElementById('plateStats');
  if(plateStatsEl){
    let statsHtml = '';
    statsHtml += `
    <div class="plate-stat">
      <div class="plate-stat-label">Km mois précédent</div>
      <div class="plate-stat-value">${lastPeriod ? lastPeriod.km.toLocaleString('fr-FR')+' km' : '—'}</div>
      <div class="plate-stat-sub">${lastPeriod ? `du ${fmtDate(lastPeriod.from)} au ${fmtDate(lastPeriod.to)}` : 'pas assez de relevés'}</div>
    </div>
    <div class="plate-stat">
      <div class="plate-stat-label">Km depuis l'achat</div>
      <div class="plate-stat-value">${sincePurchase!=null ? sincePurchase.toLocaleString('fr-FR')+' km' : '—'}</div>
      <div class="plate-stat-sub">depuis le ${fmtDate(PURCHASE_DATE)} (${PURCHASE_MILEAGE.toLocaleString('fr-FR')} km)</div>
    </div>
    <div class="plate-stat">
      <div class="plate-stat-label">Consommation moy.</div>
      <div class="plate-stat-value">${fStats ? fStats.avgConso.toFixed(1)+' L/100' : '—'}</div>
      <div class="plate-stat-sub">${fStats ? `sur ${fStats.count} pleins · ${fStats.totalKm.toLocaleString('fr-FR')} km` : 'ajoute au moins 2 pleins'}</div>
    </div>`;
    plateStatsEl.innerHTML = statsHtml;
  }

  if(currentTab==='carburant'){
    app.innerHTML = renderFuelTabHtml(fStats);
    return;
  }

  let html = '';

  // Bannière rappel mensuel de relevé kilométrique
  const lastReport = lastMileageReportDate();
  const daysSinceReport = lastReport ? daysBetween(lastReport, new Date()) : null;
  if(daysSinceReport==null || daysSinceReport >= 30){
    const overdueDays = daysSinceReport!=null ? daysSinceReport - 30 : null;
    html += `
    <div class="card ${daysSinceReport==null || overdueDays>10 ? 'danger':'warn'}" style="margin-bottom:12px;">
      <div class="card-top">
        <div class="card-name">🔧 Relevé kilométrique mensuel</div>
        <div class="card-status">${lastReport? 'À jour' : 'Manquant'}</div>
      </div>
      <div class="card-meta"><span>${lastReport? `Dernier relevé le ${fmtDate(lastReport)} (${daysSinceReport} j) — donne le kilométrage actuel pour affiner les échéances` : "Aucun relevé enregistré — indique le kilométrage actuel"}</span></div>
    </div>`;
  }

  // Bannière rappel le plus urgent (uniquement parmi les rappels datés)
  const today = new Date();
  const allReminders = state.reminders||[];
  const datedReminders = [...allReminders].filter(r=>r.date).sort((a,b)=> new Date(a.date)-new Date(b.date));
  const urgent = datedReminders.find(r=> daysBetween(today, new Date(r.date)) <= 30);
  if(urgent){
    const daysLeft = daysBetween(today, new Date(urgent.date));
    const overdue = daysLeft < 0;
    html += `
    <div class="card ${overdue?'danger':'warn'}" style="margin-bottom:18px;">
      <div class="card-top">
        <div class="card-name">📅 ${urgent.label}</div>
        <div class="card-status">${overdue? 'Dépassé' : daysLeft===0? "Aujourd'hui" : daysLeft+' j restants'}</div>
      </div>
      <div class="card-meta"><span>Échéance : ${fmtDate(urgent.date)}</span></div>
      ${urgent.notes? `<div class="card-meta" style="margin-top:4px;">${escapeHtml(urgent.notes)}</div>`: ''}
    </div>`;
  }

  // Échéances (calculées ici pour pouvoir intégrer les priorités manuelles dans Rappels & RDV ci-dessous)
  const periodicTypes = state.types.filter(t=> t.intervalKm || t.intervalMonths);
  const statused = periodicTypes.map(type=> ({ type, s: computeStatus(type) }));

  // Une priorité manuelle explicitement définie fait remonter l'échéance dans Rappels & RDV,
  // peu importe son statut automatique (en retard / estimé / à jour…)
  const manualPriorityItems = statused.filter(x=> !!x.type.priority);
  const autoItems = statused.filter(x=> !x.type.priority);

  const buckets = [
    { key:'danger',    icon:'🔴', title:'En retard',                    items: autoItems.filter(x=>x.s.level==='danger') },
    { key:'warn',      icon:'🟡', title:'À prévoir bientôt',             items: autoItems.filter(x=>x.s.level==='warn') },
    { key:'estimated', icon:'🔵', title:'Estimé (aucun historique)',     items: autoItems.filter(x=>x.s.level==='estimated') },
    { key:'unknown',   icon:'⚪', title:'Jamais vérifié / renseigné',    items: autoItems.filter(x=>x.s.level==='unknown') },
    { key:'ok',        icon:'🟢', title:'À jour',                        items: autoItems.filter(x=>x.s.level==='ok') },
  ];

  function renderTypeCardHtml(type, s){
    const statusLabel = s.level==='danger' ? 'En retard' : s.level==='warn' ? 'À prévoir' : s.level==='estimated' ? 'Estimé' : s.level==='unknown' ? 'Jamais renseigné' : 'À jour';
    let metaParts = [];
    if(s.last){
      metaParts.push(`Dernier: ${fmtDate(s.last.date)}${s.last.mileage!=null? ' · '+fmtKm(s.last.mileage):''}`);
    } else if(s.estimated){
      metaParts.push('Pas d\'historique — estimation depuis achat/kilométrage actuel');
    } else {
      metaParts.push('Aucune donnée — à vérifier au prochain entretien');
    }
    if(type.intervalKm){
      metaParts.push(`Intervalle: ${type.intervalKm.toLocaleString('fr-FR')} km`);
      if(s.nextDueKm!=null){
        metaParts.push(`Prochaine échéance: ${fmtKm(s.nextDueKm)}`);
      }
      if(s.kmRemaining!=null && s.last){
        metaParts.push(s.kmRemaining>=0 ? `${s.kmRemaining.toLocaleString('fr-FR')} km restants` : `${Math.abs(s.kmRemaining).toLocaleString('fr-FR')} km de dépassement`);
      }
      if(s.projectedDate){
        metaParts.push(`≈ ${fmtDate(s.projectedDate)} à votre rythme actuel`);
      }
    }
    if(type.intervalMonths){
      metaParts.push(`Intervalle: ${type.intervalMonths} mois`);
      if(s.monthsInfo){
        if(s.estimated){
          metaParts.push(`Échéance estimée: ${fmtDate(s.monthsInfo.dueDate)}`);
        } else {
          metaParts.push(s.monthsInfo.daysRemaining>=0 ? `échéance ${fmtDate(s.monthsInfo.dueDate)}` : `dépassé depuis ${fmtDate(s.monthsInfo.dueDate)}`);
        }
      }
    }
    return `
      <div class="card ${s.level}">
        <div class="card-top">
          <div class="card-name">${type.name}</div>
          <div class="card-status">${statusLabel}</div>
        </div>
        <div class="card-meta">${metaParts.map(p=>`<span>${p}</span>`).join('')}</div>
        ${s.level!=='unknown' ? `<div class="bar"><div class="bar-fill" style="width:${Math.round(s.ratio*100)}%"></div></div>` : ''}
        <div class="card-actions">
          <button class="small primary" onclick="openLogModal('${type.id}')">Marquer comme fait</button>
          <button class="ghost small" onclick="openTypeModal('${type.id}')">Modifier</button>
        </div>
      </div>`;
  }

  // Rappels & RDV — regroupés par statut (priorités en haut, estimés en bas)
  // Inclut à la fois les rappels manuels ET les échéances auxquelles une priorité a été assignée
  html += `<div class="section-title">Rappels &amp; RDV</div>`;
  const totalRappelItems = allReminders.length + manualPriorityItems.length;
  if(totalRappelItems===0){
    html += `<div class="cards"><div class="empty">Aucun rappel programmé.</div></div>`;
  } else {
    REMINDER_STATUSES.forEach(statusDef=>{
      const items = allReminders
        .filter(r=> (r.status||'estime')===statusDef.key)
        .sort((a,b)=>{
          if(a.date && b.date) return new Date(a.date)-new Date(b.date);
          if(a.date) return -1; // items datés d'abord dans chaque groupe
          if(b.date) return 1;
          return 0;
        });
      const typeItems = manualPriorityItems.filter(x=> x.type.priority===statusDef.key);
      if(items.length===0 && typeItems.length===0) return;
      html += `<div class="section-title" style="margin-top:16px; font-size:12.5px; border-bottom:none; padding-bottom:0;">${statusDef.icon} ${statusDef.label} <small>${items.length + typeItems.length}</small></div>`;
      html += `<div class="cards" style="margin-bottom:6px;">`;
      typeItems.forEach(({type, s})=>{ html += renderTypeCardHtml(type, s); });
      items.forEach(r=>{
        let statusLabel, cardLevel;
        if(r.date){
          const daysLeft = daysBetween(today, new Date(r.date));
          cardLevel = daysLeft<0 ? 'danger' : daysLeft<=30 ? 'warn' : statusDef.key;
          statusLabel = daysLeft<0 ? `Dépassé (${Math.abs(daysLeft)} j)` : daysLeft===0? "Aujourd'hui" : `${daysLeft} j restants`;
        } else {
          cardLevel = statusDef.key;
          statusLabel = statusDef.label;
        }
        html += `
        <div class="card ${cardLevel}">
          <div class="card-top">
            <div class="card-name">${escapeHtml(r.label)}</div>
            <div class="card-status">${statusLabel}</div>
          </div>
          <div class="card-meta"><span>${r.date? fmtDate(r.date) : 'Pas de date fixée'}</span></div>
          ${r.notes? `<div class="card-meta" style="margin-top:4px;">${escapeHtml(r.notes)}</div>`: ''}
          <div class="card-actions">
            <button class="small primary" onclick="openValidateReminderModal('${r.id}')">Valider</button>
            <button class="ghost small" onclick="openReminderModal('${r.id}')">Modifier</button>
            <button class="ghost small" onclick="deleteReminder('${r.id}')">Supprimer</button>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
  }
  html += `<button class="fab-add" style="margin-top:10px;" onclick="openReminderModal()">+ Ajouter un rappel de RDV</button>`;


  // Échéances — regroupées par statut pour une lecture claire (uniquement celles sans priorité manuelle)
  html += `<div class="section-title" style="margin-top:26px;">Échéances <small>${state.currentMileage!=null? fmtKm(state.currentMileage) : 'kilométrage non renseigné'}</small></div>`;

  buckets.forEach(bucket=>{
    if(bucket.items.length===0) return;
    html += `<div class="section-title" style="margin-top:16px; font-size:12.5px; border-bottom:none; padding-bottom:0;">${bucket.icon} ${bucket.title} <small>${bucket.items.length}</small></div>`;
    html += `<div class="cards" style="margin-bottom:6px;">`;
    bucket.items.forEach(({type, s})=>{ html += renderTypeCardHtml(type, s); });
    html += `</div>`;
  });

  // Journal
  html += `<div class="section-title" style="margin-top:26px;">✅ Journal d'entretien <small>historique — déjà fait</small></div>`;
  const sortedEntries = [...state.entries].sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(sortedEntries.length===0){
    html += `<div class="empty">Aucune intervention enregistrée pour l'instant.</div>`;
  } else {
    html += `<div class="cards">`;
    sortedEntries.forEach(e=>{
      html += `
      <div class="log-entry">
        <div class="log-left">
          <div class="log-type">${e.typeName}</div>
          <div class="log-sub">${fmtDate(e.date)}${e.mileage!=null? ' · '+fmtKm(e.mileage):''}</div>
          ${e.notes? `<div class="log-notes">${escapeHtml(e.notes)}</div>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="log-cost">${e.cost? e.cost+' €':''}</div>
          <button class="ghost small" onclick="deleteEntry('${e.id}')">✕</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<button class="fab-add" onclick="openLogModal(null)">+ Ajouter une intervention</button>`;
  html += `<button class="fab-add" style="margin-top:8px; background:transparent; color:var(--text-dim);" onclick="exportBackup()">⭳ Exporter la sauvegarde (.json)</button>`;
  html += `<button class="fab-add" style="margin-top:8px; background:transparent; color:var(--text-dim);" onclick="document.getElementById('importFileInput').click()">⭱ Importer une sauvegarde (.json)</button>`;
  html += `<input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="importBackup(event)">`;

  app.innerHTML = html;
}

function switchTab(tab){
  currentTab = tab;
  render();
}

function renderFuelTabHtml(fStats){
  const entries = state.fuelEntries||[];
  const sortedByMileage = [...entries].filter(e=>e.mileage!=null).sort((a,b)=>a.mileage-b.mileage);
  const sortedByDateDesc = [...entries].sort((a,b)=> new Date(b.date)-new Date(a.date));

  let html = '';
  html += `<div class="section-title">⛽ Consommation carburant</div>`;

  if(fStats){
    html += `<div class="cards" style="margin-bottom:16px;">
      <div class="card ok">
        <div class="card-top">
          <div class="card-name">Moyenne générale</div>
          <div class="card-status">${fStats.avgConso.toFixed(1)} L/100km</div>
        </div>
        <div class="card-meta"><span>${fStats.count} pleins · ${fStats.totalKm.toLocaleString('fr-FR')} km · ${fStats.totalLiters.toFixed(1)} L cumulés</span></div>
      </div>
      ${fStats.lastConso!=null ? `
      <div class="card">
        <div class="card-top">
          <div class="card-name">Dernier plein</div>
          <div class="card-status">${fStats.lastConso.toFixed(1)} L/100km</div>
        </div>
      </div>`: ''}
    </div>`;
  } else {
    html += `<div class="empty" style="margin-bottom:16px;">Ajoute au moins deux pleins (avec kilométrage) pour voir apparaître la consommation.</div>`;
  }

  html += `<div class="section-title" style="font-size:12.5px; border-bottom:none; padding-bottom:0;">Historique des pleins</div>`;
  if(sortedByDateDesc.length===0){
    html += `<div class="cards"><div class="empty">Aucun plein enregistré.</div></div>`;
  } else {
    html += `<div class="cards">`;
    sortedByDateDesc.forEach(e=>{
      const conso = fuelConsoForEntry(e, sortedByMileage);
      const pricePerL = (e.cost!=null && e.liters) ? (e.cost/e.liters) : null;
      html += `
      <div class="card">
        <div class="card-top">
          <div class="card-name">${fmtDate(e.date)}</div>
          <div class="card-status">${conso!=null ? conso.toFixed(1)+' L/100km' : '—'}</div>
        </div>
        <div class="card-meta">
          <span>${fmtKm(e.mileage)}</span>
          <span>${e.liters!=null ? e.liters.toFixed(2)+' L' : '—'}</span>
          ${e.cost!=null ? `<span>${e.cost.toFixed(2)} €${pricePerL? ' ('+pricePerL.toFixed(3)+' €/L)':''}</span>` : ''}
        </div>
        ${e.notes? `<div class="card-meta" style="margin-top:4px;">${escapeHtml(e.notes)}</div>`: ''}
        <div class="card-actions">
          <button class="ghost small" onclick="openFuelModal('${e.id}')">Modifier</button>
          <button class="ghost small" onclick="deleteFuelEntry('${e.id}')">Supprimer</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `<button class="fab-add" style="margin-top:10px;" onclick="openFuelModal()">+ Ajouter un plein</button>`;
  return html;
}

async function saveFuelEntry(id){
  const date = document.getElementById('f_date').value;
  const mileageVal = document.getElementById('f_mileage').value;
  const litersVal = document.getElementById('f_liters').value;
  const costVal = document.getElementById('f_cost').value;
  const notes = document.getElementById('f_notes').value.trim();
  if(!date || !mileageVal || !litersVal){ alert('Merci de renseigner au minimum la date, le kilométrage et les litres.'); return; }
  const mileage = parseInt(mileageVal,10);
  const liters = parseFloat(litersVal);
  const cost = costVal ? parseFloat(costVal) : null;

  state.fuelEntries = state.fuelEntries || [];
  if(id){
    const idx = state.fuelEntries.findIndex(x=>x.id===id);
    if(idx>-1) state.fuelEntries[idx] = { ...state.fuelEntries[idx], date, mileage, liters, cost, notes };
  } else {
    state.fuelEntries.push({ id:'f_'+Date.now(), date, mileage, liters, cost, notes });
  }
  if(state.currentMileage==null || mileage > state.currentMileage){
    state.currentMileage = mileage;
  }
  await saveState();
  closeModal();
  render();
}

async function deleteFuelEntry(id){
  if(!confirm('Supprimer ce plein ?')) return;
  state.fuelEntries = (state.fuelEntries||[]).filter(e=>e.id!==id);
  await saveState();
  render();
}

function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!confirm('Importer cette sauvegarde va remplacer toutes les données actuellement affichées. Continuer ?')) return;
      state = { ...state, ...parsed, types: parsed.types || DEFAULT_TYPES };
      state.reminders = (state.reminders||[]).map(r=> ({ status:'estime', ...r }));
      state.fuelEntries = state.fuelEntries || [];
      await saveState();
      render();
      alert('Sauvegarde importée avec succès.');
    }catch(err){
      alert("Fichier invalide : impossible de lire cette sauvegarde.");
      console.error(err);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `carnet-entretien-tj-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function saveTypeModal(id){
  const idx = state.types.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const name = document.getElementById('t_name').value.trim();
  const kmVal = document.getElementById('t_km').value;
  const monthsVal = document.getElementById('t_months').value;
  const priorityVal = document.getElementById('t_priority').value;
  if(!name){ alert('Merci de renseigner un intitulé.'); return; }
  state.types[idx] = {
    ...state.types[idx],
    name,
    intervalKm: kmVal ? parseInt(kmVal,10) : null,
    intervalMonths: monthsVal ? parseInt(monthsVal,10) : null,
    priority: priorityVal || null
  };
  // Garder la cohérence du typeName dans le journal si l'intitulé a changé
  state.entries = state.entries.map(e=> e.typeId===id ? { ...e, typeName: name } : e);
  await saveState();
  closeModal();
  render();
}

async function saveValidateReminder(id){
  const r = (state.reminders||[]).find(x=>x.id===id);
  if(!r) return;
  const date = document.getElementById('v_date').value;
  const mileageVal = document.getElementById('v_mileage').value;
  const costVal = document.getElementById('v_cost').value;
  const notes = document.getElementById('v_notes').value.trim();
  if(!date){ alert('Merci de renseigner une date.'); return; }

  const typeId = 'custom_' + r.label.toLowerCase().replace(/[^a-z0-9]+/g,'_');
  if(!state.types.find(t=>t.id===typeId)){
    state.types.push({ id: typeId, name: r.label, intervalKm:null, intervalMonths:null });
  }
  const entry = {
    id: 'e_' + Date.now(),
    typeId, typeName: r.label,
    date,
    mileage: mileageVal ? parseInt(mileageVal,10) : null,
    cost: costVal ? parseFloat(costVal) : null,
    notes
  };
  state.entries.push(entry);
  if(entry.mileage!=null && (state.currentMileage==null || entry.mileage > state.currentMileage)){
    state.currentMileage = entry.mileage;
    state.mileageHistory = state.mileageHistory || [];
    const existingSame = state.mileageHistory.find(h=>h.date===entry.date);
    if(existingSame){
      existingSame.mileage = Math.max(existingSame.mileage, entry.mileage);
    } else {
      state.mileageHistory.push({ date: entry.date, mileage: entry.mileage });
    }
  }
  state.reminders = (state.reminders||[]).filter(x=>x.id!==id);
  await saveState();
  closeModal();
  render();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

async function saveEntry(){
  const typeSel = document.getElementById('f_type').value;
  let typeId = typeSel, typeName;
  if(typeSel === '__custom__'){
    const customName = document.getElementById('f_customname').value.trim();
    if(!customName){ alert('Merci de nommer l\'intervention.'); return; }
    typeId = 'custom_' + customName.toLowerCase().replace(/[^a-z0-9]+/g,'_');
    typeName = customName;
    if(!state.types.find(t=>t.id===typeId)){
      state.types.push({ id: typeId, name: customName, intervalKm:null, intervalMonths:null });
    }
  } else {
    typeName = state.types.find(t=>t.id===typeId).name;
  }

  const date = document.getElementById('f_date').value;
  const mileageVal = document.getElementById('f_mileage').value;
  const costVal = document.getElementById('f_cost').value;
  const notes = document.getElementById('f_notes').value.trim();

  if(!date){ alert('Merci de renseigner une date.'); return; }

  const entry = {
    id: 'e_' + Date.now(),
    typeId, typeName,
    date,
    mileage: mileageVal ? parseInt(mileageVal,10) : null,
    cost: costVal ? parseFloat(costVal) : null,
    notes
  };
  state.entries.push(entry);
  if(entry.mileage!=null && (state.currentMileage==null || entry.mileage > state.currentMileage)){
    state.currentMileage = entry.mileage;
    state.mileageHistory = state.mileageHistory || [];
    const existingSame = state.mileageHistory.find(h=>h.date===entry.date);
    if(existingSame){
      existingSame.mileage = Math.max(existingSame.mileage, entry.mileage);
    } else {
      state.mileageHistory.push({ date: entry.date, mileage: entry.mileage });
    }
  }
  await saveState();
  closeModal();
  render();
}

async function deleteEntry(id){
  if(!confirm('Supprimer cette intervention du journal ?')) return;
  state.entries = state.entries.filter(e=>e.id!==id);
  await saveState();
  render();
}

document.getElementById('saveOdoBtn').addEventListener('click', async ()=>{
  const val = document.getElementById('odoInput').value;
  state.currentMileage = val ? parseInt(val,10) : null;
  if(state.currentMileage!=null){
    const todayStr = new Date().toISOString().slice(0,10);
    state.mileageHistory = state.mileageHistory || [];
    const existingToday = state.mileageHistory.find(h=>h.date===todayStr);
    if(existingToday){
      existingToday.mileage = state.currentMileage;
    } else {
      state.mileageHistory.push({ date: todayStr, mileage: state.currentMileage });
    }
  }
  await saveState();
  render();
});
