<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet d'entretien — Jeep TJ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#E6EDF8;
  --panel:#FFFFFF;
  --panel-raised:#F1F5F9;
  --field-bg:#FFFFFF;
  --line:#D3DCEB;
  --track:#D3DCEB;
  --hover:#0F172A0A;
  --overlay:rgba(15,23,42,0.55);
  --accent:#2563EB;
  --accent-dim:#2563EB40;
  --on-accent:#FFFFFF;
  --ok:#16A34A;
  --warn:#D97706;
  --danger:#DC2626;
  --info:#0284C7;
  --text:#0F172A;
  --text-dim:#64748B;
  color-scheme:light;
  --mono:'JetBrains Mono',monospace;
  --disp:'Oswald',sans-serif;
  --body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  padding-bottom:60px;
}
.plate{
  background:#4F7FD9;
  color:#FFFFFF;
  border-bottom:3px solid #2F5FBF;
  padding:22px 20px 18px;
  position:relative;
}
.plate-eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:3px;
  color:#DCE8FF;
  text-transform:uppercase;
}
.plate-title{
  font-family:var(--disp);
  font-size:26px;
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
  margin:2px 0 10px;
}
.plate-specs{
  display:flex;
  flex-wrap:wrap;
  gap:6px 16px;
  font-family:var(--mono);
  font-size:11.5px;
  color:#E6EEFF;
}
.odo-row{
  margin-top:16px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.odo-label{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:2px;
  color:#DCE8FF;
  text-transform:uppercase;
}
.odo-display{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px 14px;
  font-family:var(--mono);
  font-size:22px;
  font-weight:700;
  letter-spacing:3px;
  color:var(--accent);
  display:flex;
  align-items:center;
  gap:6px;
}
.odo-display input{
  background:transparent;
  border:none;
  color:var(--accent);
  font-family:var(--mono);
  font-size:22px;
  font-weight:700;
  letter-spacing:3px;
  width:110px;
  outline:none;
}
.odo-display span{opacity:.6; font-size:14px;}

.plate-stats{
  margin-top:14px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.plate-stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px 12px;
  min-width:150px;
}
.plate-stat-label{
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:3px;
}
.plate-stat-value{
  font-family:var(--disp);
  font-size:19px;
  font-weight:600;
  color:var(--accent);
}
.plate-stat-sub{
  font-family:var(--mono);
  font-size:10px;
  color:var(--text-dim);
  margin-top:2px;
}

.tab-bar{
  display:flex;
  gap:8px;
  max-width:720px;
  margin:0 auto;
  padding:14px 18px 0;
}
.tab-btn{
  flex:1;
  font-family:var(--disp);
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  padding:10px 8px;
  color:var(--text-dim);
  cursor:pointer;
}
.tab-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--on-accent);
}

.section{
  padding:24px 18px 4px;
  max-width:720px;
  margin:0 auto;
}
.section-title{
  font-family:var(--disp);
  font-size:15px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-dim);
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
  margin-bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.section-title small{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:0;
  color:var(--text-dim);
}

.cards{display:flex; flex-direction:column; gap:10px;}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--line);
  border-radius:6px;
  padding:12px 14px;
}
.card.ok{border-left-color:var(--ok);}
.card.warn{border-left-color:var(--warn);}
.card.danger{border-left-color:var(--danger);}
.card.unknown{border-left-color:var(--text-dim);}
.card.estimated{border-left-color:var(--info);}
.card-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}
.card-name{font-family:var(--disp); font-size:15px; letter-spacing:.5px;}
.card-status{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:3px;
  white-space:nowrap;
}
.card.ok .card-status{background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok);}
.card.warn .card-status{background:color-mix(in srgb, var(--warn) 14%, transparent); color:var(--warn);}
.card.danger .card-status{background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger);}
.card.unknown .card-status{background:color-mix(in srgb, var(--text-dim) 14%, transparent); color:var(--text-dim);}
.card.estimated .card-status{background:color-mix(in srgb, var(--info) 14%, transparent); color:var(--info);}
.card-meta{
  font-family:var(--mono);
  font-size:11px;
  color:var(--text-dim);
  margin-top:6px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.bar{
  height:5px;
  background:var(--track);
  border-radius:3px;
  margin-top:9px;
  overflow:hidden;
}
.bar-fill{height:100%; border-radius:3px;}
.card.ok .bar-fill{background:var(--ok);}
.card.warn .bar-fill{background:var(--warn);}
.card.danger .bar-fill{background:var(--danger);}
.card.unknown .bar-fill{background:var(--text-dim);}
.card.estimated .bar-fill{background:var(--info);}
.card.priorite_haute{border-left-color:var(--danger);}
.card.priorite_haute .card-status{background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger);}
.card.priorite_moyenne{border-left-color:var(--warn);}
.card.priorite_moyenne .card-status{background:color-mix(in srgb, var(--warn) 14%, transparent); color:var(--warn);}
.card.priorite_basse{border-left-color:var(--ok);}
.card.priorite_basse .card-status{background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok);}
.card-actions{margin-top:9px; display:flex; gap:8px;}

button{
  font-family:var(--body);
  font-weight:600;
  font-size:12.5px;
  border-radius:5px;
  border:1px solid var(--line);
  background:var(--panel-raised);
  color:var(--text);
  padding:7px 12px;
  cursor:pointer;
}
button:hover{border-color:var(--accent-dim);}
button.primary{
  background:var(--accent);
  color:var(--on-accent);
  border-color:var(--accent);
}
button.primary:hover{filter:brightness(1.08);}
button.ghost{background:transparent; color:var(--text-dim); border-color:transparent; padding:6px 4px;}
button.small{padding:5px 9px; font-size:11.5px;}

.log-entry{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.log-entry:last-child{border-bottom:none;}
.log-left{display:flex; flex-direction:column; gap:2px;}
.log-type{font-family:var(--disp); font-size:14px;}
.log-sub{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
.log-cost{font-family:var(--mono); font-size:13px; color:var(--accent); white-space:nowrap;}
.log-notes{font-size:11.5px; color:var(--text-dim); margin-top:2px; max-width:320px;}

.empty{
  color:var(--text-dim);
  font-size:13px;
  padding:20px 0;
  text-align:center;
  font-style:italic;
}

.fab-add{
  display:block;
  width:100%;
  margin-top:14px;
  padding:12px;
  text-align:center;
}

.modal-overlay{
  position:fixed; inset:0;
  background:var(--overlay);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:50;
}
.modal{
  background:var(--panel);
  border:1px solid var(--line);
  border-top:3px solid var(--accent);
  border-radius:12px 12px 0 0;
  width:100%; max-width:520px;
  padding:20px 18px 24px;
  max-height:88vh;
  overflow-y:auto;
}
.modal h3{
  font-family:var(--disp);
  font-size:17px;
  letter-spacing:.5px;
  margin:0 0 14px;
  text-transform:uppercase;
}
.field{margin-bottom:12px;}
.field label{
  display:block;
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:5px;
}
.field input, .field select, .field textarea{
  width:100%;
  background:var(--field-bg);
  border:1px solid var(--line);
  border-radius:5px;
  color:var(--text);
  padding:9px 10px;
  font-family:var(--body);
  font-size:14px;
  outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical; min-height:50px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex; gap:10px; margin-top:16px;}
.modal-actions button{flex:1; padding:11px;}

.settings-toggle{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--text-dim);
  background:none;
  border:none;
  text-decoration:underline;
  cursor:pointer;
  padding:0;
}
.interval-edit{
  display:flex;
  gap:8px;
  margin-top:8px;
  align-items:center;
}
.interval-edit input{width:70px;}

.loading{text-align:center; padding:40px; color:var(--text-dim); font-family:var(--mono); font-size:12px;}
/* ===== v2.0 ===== */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:14px;}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 10px; cursor:pointer;}
.kpi:hover{border-color:var(--accent-dim);}
.kpi b{display:block; font-family:var(--disp); font-size:21px; font-weight:500; line-height:1.2;}
.kpi small{font-family:var(--mono); font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-dim);}
.tab-note{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin:2px 2px 8px;}
.grp{margin-top:12px;}
.grp-head{display:flex; align-items:center; gap:8px; padding:6px 2px; cursor:pointer; user-select:none;}
.grp-head.static{cursor:default;}
.grp-title{font-family:var(--disp); font-size:13.5px; letter-spacing:.6px; text-transform:uppercase; flex:1;}
.grp-count{font-family:var(--mono); font-size:11px; color:var(--text-dim);}
.grp .chev{transition:transform .15s;}
.grp:not(.open) .grp-head .chev{transform:rotate(-90deg);}
.list{background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
.row{border-top:1px solid var(--line);}
.row:first-child{border-top:none;}
.row-head{display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer;}
.row-head:hover{background:var(--hover);}
.dot{width:9px; height:9px; border-radius:50%; flex:none;}
.row-title{flex:1; min-width:0; font-size:14px;}
.row-sub{font-family:var(--mono); font-size:11px; color:var(--text-dim); text-align:right;}
.row-badge{font-family:var(--mono); font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; padding:2px 7px; border-radius:3px; white-space:nowrap;}
.mini-bar{width:70px; height:4px; background:var(--track); border-radius:2px; flex:none; overflow:hidden;}
.mini-bar i{display:block; height:100%; border-radius:2px;}
.chev{color:var(--text-dim); font-size:13px; transition:transform .15s; flex:none;}
.row.open .row-head .chev{transform:rotate(180deg);}
.row-detail{display:none; padding:2px 12px 11px 31px; font-size:13px; color:var(--text-dim); line-height:1.5;}
.row.open .row-detail{display:block;}
.det-meta{display:flex; gap:4px 14px; flex-wrap:wrap; font-family:var(--mono); font-size:11px;}
.det-rdv{margin-top:4px; font-weight:600; color:var(--accent);}
.det-notes{margin-top:5px;}
.log-left{flex:1; min-width:0;}
.log-notes.clamp{max-width:none; cursor:pointer; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.log-notes.clamp.open{display:block; -webkit-line-clamp:unset;}
@media (max-width:520px){
  .tab-btn{font-size:11px; letter-spacing:.3px; padding:9px 2px;}
  .row-head{flex-wrap:wrap;}
  .row-title{flex-basis:calc(100% - 60px);}
  .mini-bar{display:none;}
  .kpi b{font-size:18px;}
}

</style>
</head>
<body>

<div class="plate">
  <div class="plate-eyebrow">Carnet d'entretien</div>
  <div class="plate-title">Jeep Wrangler TJ Sahara</div>
  <div class="plate-specs">
    <span>4.0L I6 · 181 ch</span>
    <span>1998 · Automatique (32RH)</span>
    <span>VIN 1J4FYA9S0VP531754</span>
    <span>Immat. EJ-475-JK <span id="versionTag" style="opacity:0.55; font-size:10px;"></span></span>
  </div>
  <div class="odo-row">
    <span class="odo-label">Kilométrage actuel</span>
    <div class="odo-display">
      <input id="odoInput" type="number" inputmode="numeric" placeholder="——————">
      <span>km</span>
    </div>
    <button class="small" id="saveOdoBtn">Mettre à jour</button>
  </div>
  <div id="plateStats" class="plate-stats"></div>
</div>

<div class="tab-bar">
  <button class="tab-btn" id="tab_journal" onclick="switchTab('journal')">📋 Journal</button>
  <button class="tab-btn" id="tab_afaire" onclick="switchTab('afaire')">🔔 À faire</button>
  <button class="tab-btn" id="tab_echeances" onclick="switchTab('echeances')">🗓️ Échéances</button>
  <button class="tab-btn" id="tab_carburant" onclick="switchTab('carburant')">⛽ Carburant</button>
</div>

<div id="app" class="section">
  <div class="loading">Chargement du carnet…</div>
</div>

<div id="modalRoot"></div>

<script>
const STORAGE_KEY = 'jeep-tj-lacanau-carnet-v1';
const APP_VERSION = '2.0';
const PURCHASE_DATE = '2026-08-20';
const PURCHASE_MILEAGE = 97785;

// Statuts possibles pour un rappel/RDV — ordre = ordre d'affichage (priorités en premier)
const REMINDER_STATUSES = [
  { key:'priorite_haute',   icon:'🔴', label:'Priorité haute' },
  { key:'priorite_moyenne', icon:'🟡', label:'Priorité moyenne' },
  { key:'priorite_basse',   icon:'🟢', label:'Priorité basse' },
  { key:'estime',           icon:'🔵', label:'Estimé (pas de date/priorité fixée)' },
];
function reminderStatusInfo(key){ return REMINDER_STATUSES.find(s=>s.key===key) || REMINDER_STATUSES[3]; }
let currentTab = 'afaire';

const DEFAULT_TYPES = [
  { id:'vidange',    name:'Vidange moteur — huile 10W30 (MS-6395) + filtre', intervalKm:5000,  intervalMonths:12  },
  { id:'filtre_air', name:'Filtre à air',                     intervalKm:15000, intervalMonths:12 },
  { id:'liq_frein',  name:'Liquide de frein',                 intervalKm:null,  intervalMonths:24 },
  { id:'refroid',    name:'Liquide de refroidissement',       intervalKm:30000, intervalMonths:24 },
  { id:'boite_vit',  name:'Huile boîte de vitesses 32RH auto — ATF+4 (MS-9602)', intervalKm:20000, intervalMonths:24 },
  { id:'bte_transf', name:'Huile boîte de transfert NP231 — ATF+4 (MS-9602)', intervalKm:20000, intervalMonths:24 },
  { id:'pont_ar',    name:'Huile pont arrière Dana 35C — 75W140 synthétique + additif GL (MS-10111)', intervalKm:20000, intervalMonths:24 },
  { id:'pont_av',    name:'Huile pont avant Dana 30 — 75W140 synthétique (MS-8985)', intervalKm:40000, intervalMonths:24 },
  { id:'dir_assistee', name:'Liquide de direction assistée (MS-5931/MS-9602)', intervalKm:160000, intervalMonths:60 },
  { id:'bougies',    name:"Bougies d'allumage",                intervalKm:30000, intervalMonths:null },
  { id:'courroie',   name:'Courroie accessoires',              intervalKm:60000, intervalMonths:60 },
  { id:'silent_blocs', name:'Contrôle silent blocs / train roulant', intervalKm:null, intervalMonths:12 },
  { id:'echappement', name:'Échappement (ligne complète)',     intervalKm:null,  intervalMonths:null },
  { id:'cession',    name:'Cession / Immatriculation',          intervalKm:null,  intervalMonths:null },
  { id:'ct',         name:'Contrôle technique',                intervalKm:null,  intervalMonths:24 },
];

let state = {
  currentMileage: 97785,
  types: DEFAULT_TYPES,
  entries: [
    { id:'e_ct_20251021', typeId:'ct', typeName:'Contrôle technique', date:'2025-10-21', mileage:94643, cost:null, notes:"CT initial DÉFAVORABLE (majeures) — Auto Bilan Canaulais / Norisko, PV n°25036829. Majeures : plaques d'immatriculation non conformes (AV, AR) ; numéro d'identification/VIN manquant ou introuvable. Mineures : freins AR déséquilibrés (22%), essuie-glaces AR/AVD défectueux, éclairage plaque AR, pneus usure anormale (4 roues), amortisseurs AV asymétrie 32%, sièges AR absents lors du contrôle. Ripage +0,7 m/km (excellent). Limite de validité contre-visite : 20/12/2025." },
    { id:'e_ct_20251215', typeId:'ct', typeName:'Contrôle technique', date:'2025-12-15', mileage:94987, cost:1184.58, notes:"Contre-visite FAVORABLE — facture Alex Garage-Méca n°4823 (17/12/2025, réglée 1200€ en espèces par la venderesse le 30/01/2026). Travaux : 2 plaques d'immatriculation neuves, frappe du numéro de série (150€), forfait peinture aile AVG (250€), poignée levier de vitesse, balais essuie-glace (AVD/AVG/AR), vidange huile 0W30, contrôle technique (64€)." },
    { id:'e_vidange_20251215', typeId:'vidange', typeName:'Vidange moteur (huile + filtre)', date:'2025-12-15', mileage:94987, cost:null, notes:"Huile 0W30 — inclus dans facture Alex Garage-Méca n°4823. Écart avec la préconisation FSM/fiche produit (10W30 MS-6395) : à signaler au garagiste pour la prochaine vidange." },
    { id:'e_echap_20250318', typeId:'echappement', typeName:'Échappement (ligne complète)', date:'2025-03-18', mileage:92657, cost:768.11, notes:"Remplacement ligne complète (2 silencieux + colliers AV/AR + silentbloc AR) — facture Alex Garage-Méca n°3880." },
    { id:'e_ct_20260813', typeId:'ct', typeName:'Contrôle technique', date:'2026-08-13', mileage:97502, cost:null, notes:"Nouveau CT (obtenu pour la vente) DÉFAVORABLE (majeures) — SARL Sodex Autocentre Contrôle, Lacanau, PV n°26059337. Majeures : efficacité du frein de service insuffisante (taux global 47%, seuil ≥50%) ; efficacité du frein de stationnement insuffisante (14%, seuil ≥18%) ; orientation du feu de croisement AVD hors tolérance. Mineures : mauvaise fixation feu de détresse AVG, pneus usure anormale (AVG/ARD/AVD/ARG), sièges AR absents lors du contrôle. Ripage +3,1 m/km. Limite de validité contre-visite : 12/10/2026." },
    { id:'e_ct_20260820', typeId:'ct', typeName:'Contrôle technique', date:'2026-08-20', mileage:97719, cost:null, notes:"Contre-visite FAVORABLE — Securitest Blanquefort, PV n°26030003. Valable jusqu'au 19/08/2028 (prochain contrôle : périodique normal). Freins corrigés : efficacité globale 51% (≥50% requis), frein de stationnement 20% (≥18% requis). Défaillances mineures résiduelles : jeu direction AVG, balai essuie-glace AVG, fixation feu détresse AVG, éclairage plaque AR, pneus AVD/ARD/ARG, corrosion châssis AVG/ARG, sièges AR absents lors du contrôle. Ripage +2,4 m/km." },
    { id:'e_cession_20260820', typeId:'cession', typeName:'Cession / Immatriculation', date:'2026-08-20', mileage:97785, cost:null, notes:"Certificat de cession signé à Lacanau, 15h15 — cédante Agnès Brande (12 lot Green Parc, 33680 Lacanau Océan), acquéreur Jean-François Morette (8 allée Beau Pré, 33650 Saucats). Certificat de situation administrative (non-gage) du 20/08/2026 : RAS — aucune opposition, aucun gage, véhicule non volé, immatriculation non volée/perdue/annulée." }

// Calcule le rythme de conduite moyen (km/mois) à partir de l'historique de relevés
function computeMonthlyRate(){
  const hist = [...(state.mileageHistory||[])].sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(hist.length < 2) return null;
  const first = hist[0], last = hist[hist.length-1];
  const monthsSpan = daysBetween(new Date(first.date), new Date(last.date)) / 30.44;
  if(monthsSpan < 1) return null; // pas assez de recul pour un rythme fiable
  const kmSpan = last.mileage - first.mileage;
  if(kmSpan <= 0) return null;
  return kmSpan / monthsSpan;
}

function lastMileageReportDate(){
  const hist = [...(state.mileageHistory||[])].sort((a,b)=> new Date(b.date)-new Date(a.date));
  return hist[0] ? new Date(hist[0].date) : null;
}

// Km parcourus entre les deux derniers relevés enregistrés (≈ le mois précédent, au rythme des relevés mensuels)
function kmSinceLastPeriod(){
  const hist = [...(state.mileageHistory||[])].sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(hist.length < 2) return null;
  const last = hist[hist.length-1], prev = hist[hist.length-2];
  return { km: last.mileage - prev.mileage, from: prev.date, to: last.date };
}

function kmSincePurchase(){
  if(state.currentMileage==null) return null;
  return state.currentMileage - PURCHASE_MILEAGE;
}

// Enregistre un relevé kilométrique dans l'historique (un seul point par date, on garde le plus élevé)
function recordMileage(date, mileage){
  if(!date || mileage==null) return;
  state.mileageHistory = state.mileageHistory || [];
  const same = state.mileageHistory.find(x=>x.date===date);
  if(same) same.mileage = Math.max(same.mileage, mileage);
  else state.mileageHistory.push({ date, mileage });
}

// Si le compteur actuel dépasse le dernier relevé de l'historique (ex. plein enregistré avant ce correctif),
// on ajoute le relevé manquant à la date du dernier plein / de la dernière intervention à ce kilométrage.
function reconcileMileageHistory(){
  if(state.currentMileage==null) return false;
  const hist = state.mileageHistory || [];
  const maxHist = hist.reduce((m,x)=> Math.max(m, x.mileage), 0);
  if(state.currentMileage <= maxHist) return false;
  const candidates = [
    ...(state.fuelEntries||[]).filter(e=>e.mileage===state.currentMileage).map(e=>e.date),
    ...(state.entries||[]).filter(e=>e.mileage===state.currentMileage).map(e=>e.date),
  ].sort();
  const date = candidates.length ? candidates[candidates.length-1] : new Date().toISOString().slice(0,10);
  recordMileage(date, state.currentMileage);
  return true;
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed, types: parsed.types || DEFAULT_TYPES };
    }
  }catch(e){
    console.error('Erreur de chargement', e);
    showStorageWarning();
  }
  // Migration : tout rappel existant sans statut est considéré "estimé"
  state.reminders = (state.reminders||[]).map(r=> ({ status:'estime', ...r }));
  state.fuelEntries = state.fuelEntries || [];
  const m1 = applyMigrationFactureETB();
  const m2 = applyMigrationPrioritesFaites();
  const m3 = reconcileMileageHistory();
  if(m1 || m2 || m3){ try{ await saveState(); }catch(e){ console.error(e); } }
  const vt = document.getElementById('versionTag');
  if(vt) vt.textContent = 'v' + APP_VERSION;
  render();
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Erreur de sauvegarde', e);
    showStorageWarning();
  }
}

function showStorageWarning(){
  if(document.getElementById('storageWarning')) return;
  const div = document.createElement('div');
  div.id = 'storageWarning';
  div.style.cssText = 'position:fixed; bottom:0; left:0; right:0; background:var(--danger); color:#fff; padding:10px 14px; font-family:sans-serif; font-size:12.5px; z-index:999; text-align:center;';
  div.innerHTML = "⚠️ Impossible d'enregistrer localement (navigation privée, cookies bloqués ou stockage plein). Pense à exporter ta sauvegarde régulièrement.";

}

function daysBetween(a,b){ return Math.round((b-a)/86400000); }

function computeStatus(type){
  const lastEntries = state.entries
    .filter(e=>e.typeId===type.id)
    .sort((a,b)=> new Date(b.date)-new Date(a.date));
  const last = lastEntries[0] || null;

  let kmRemaining = null, nextDueKm = null, monthsInfo = null, projectedDate = null, ratio = 0, unknown = false, estimated = false;

  if(type.intervalKm && state.currentMileage!=null){
    if(last && last.mileage!=null){
      nextDueKm = last.mileage + type.intervalKm;
      kmRemaining = nextDueKm - state.currentMileage;
      const used = state.currentMileage - last.mileage;
      ratio = Math.max(ratio, used / type.intervalKm);
    } else {
      // Pas d'historique : on estime la prochaine échéance depuis le kilométrage actuel (achat du véhicule)
      nextDueKm = state.currentMileage + type.intervalKm;
      kmRemaining = type.intervalKm;
      estimated = true;
    }
    // Projection de la date d'échéance à partir du rythme de conduite réel (km/mois)
    const rate = computeMonthlyRate();
    if(rate && kmRemaining!=null){
      const monthsToGo = Math.max(kmRemaining, 0) / rate;
      const d = new Date();
      d.setDate(d.getDate() + Math.round(monthsToGo*30.44));
      projectedDate = d;
    }
  } else if(type.intervalKm && state.currentMileage==null){
    unknown = true;
  }

  if(type.intervalMonths){
    if(last){
      const lastDate = new Date(last.date);
      const dueDate = new Date(lastDate);
      dueDate.setMonth(dueDate.getMonth()+type.intervalMonths);
      const today = new Date();
      const totalDays = daysBetween(lastDate, dueDate);
      const usedDays = daysBetween(lastDate, today);
      monthsInfo = { dueDate, daysRemaining: daysBetween(today, dueDate) };
      ratio = Math.max(ratio, usedDays/totalDays);
    } else {
      // Pas d'historique : on estime depuis aujourd'hui (date d'achat)
      const today = new Date();
      const dueDate = new Date(today);
      dueDate.setMonth(dueDate.getMonth()+type.intervalMonths);
      monthsInfo = { dueDate, daysRemaining: daysBetween(today, dueDate) };
      estimated = true;
    }
  }

  let level = 'ok';
  if(unknown) level = 'unknown';
  else if(estimated) level = 'estimated';
  else if(ratio >= 1) level = 'danger';
  else if(ratio >= 0.8) level = 'warn';

  return { last, kmRemaining, nextDueKm, monthsInfo, projectedDate, ratio: Math.min(ratio,1), level, estimated };
}

function fmtDate(d){
  return new Date(d).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtKm(n){ return n==null? '—' : n.toLocaleString('fr-FR')+' km'; }

function fuelStats(){
  const entries = [...(state.fuelEntries||[])]
    .filter(e=> e.mileage!=null && e.liters!=null)
    .sort((a,b)=> a.mileage-b.mileage);
  if(entries.length<2) return null;
  const totalLiters = entries.slice(1).reduce((sum,e)=> sum + e.liters, 0);
  const totalKm = entries[entries.length-1].mileage - entries[0].mileage;
  if(totalKm<=0) return null;
  const avgConso = totalLiters / totalKm * 100;
  const prev = entries[entries.length-2];
  const last = entries[entries.length-1];
  const lastKm = last.mileage - prev.mileage;
  const lastConso = lastKm>0 ? (last.liters/lastKm*100) : null;
  return { avgConso, lastConso, totalLiters, totalKm, count: entries.length };
}

function fuelConsoForEntry(entry, sortedByMileage){
  const idx = sortedByMileage.findIndex(e=>e.id===entry.id);
  if(idx<=0) return null;
  const prev = sortedByMileage[idx-1];
  if(entry.mileage==null || prev.mileage==null || entry.liters==null) return null;
  const km = entry.mileage - prev.mileage;
  if(km<=0) return null;
  return entry.liters / km * 100;
}

  estimated:        { c:'var(--info)',    bg:'color-mix(in srgb, var(--info) 14%, transparent)', label:'Estimé' },
  unknown:          { c:'var(--text-dim)', bg:'color-mix(in srgb, var(--text-dim) 14%, transparent)', label:'À renseigner' },
};

function toggleRow(headEl){ headEl.parentElement.classList.toggle('open'); }
function toggleGroup(key){ UI.openGroups[key] = !UI.openGroups[key]; render(); }
function gotoTab(tab, groupKey){ if(groupKey) UI.openGroups[groupKey] = true; switchTab(tab); }

function rowHtml({ level, badge, title, sub, detailHtml, barRatio, showBar }){
  const st = LEVEL_STYLE[level] || LEVEL_STYLE.estime;
  return `
  <div class="row">
    <div class="row-head" onclick="toggleRow(this)">
      <span class="dot" style="background:${st.c}"></span>
      <span class="row-title">${title}</span>
      ${showBar ? `<span class="mini-bar"><i style="width:${Math.round((barRatio||0)*100)}%; background:${st.c}"></i></span>` : ''}
      ${sub ? `<span class="row-sub">${sub}</span>` : ''}
      ${badge ? `<span class="row-badge" style="background:${st.bg}; color:${st.c}">${badge}</span>` : ''}
      <span class="chev">▾</span>
    </div>
    <div class="row-detail">${detailHtml}</div>
  </div>`;
}

function groupHtml(key, title, count, color, rowsHtml){
  const open = !!UI.openGroups[key];
  return `
  <div class="grp ${open?'open':''}">
    <div class="grp-head" onclick="toggleGroup('${key}')">
      <span class="dot" style="background:${color}"></span>
      <span class="grp-title">${title}</span>
      <span class="grp-count">${count}</span>
      <span class="chev">▾</span>
    </div>
    ${open ? `<div class="list">${rowsHtml}</div>` : ''}
  </div>`;
}

function typeMetaParts(type, s){
  const metaParts = [];
  if(s.last){
    metaParts.push(`Dernier : ${fmtDate(s.last.date)}${s.last.mileage!=null? ' · '+fmtKm(s.last.mileage):''}`);
  } else if(s.estimated){
    metaParts.push("Pas d'historique — estimation depuis achat/kilométrage actuel");
  } else {
    metaParts.push('Aucune donnée — à vérifier au prochain entretien');
  }
  if(type.intervalKm){
    metaParts.push(`Intervalle : ${type.intervalKm.toLocaleString('fr-FR')} km`);
    if(s.nextDueKm!=null) metaParts.push(`Prochaine échéance : ${fmtKm(s.nextDueKm)}`);
    if(s.projectedDate) metaParts.push(`≈ ${fmtDate(s.projectedDate)} à votre rythme actuel`);
  }
  if(type.intervalMonths){
    metaParts.push(`Intervalle : ${type.intervalMonths} mois`);
    if(s.monthsInfo){
      metaParts.push(s.estimated ? `Échéance estimée : ${fmtDate(s.monthsInfo.dueDate)}`
        : (s.monthsInfo.daysRemaining>=0 ? `Échéance ${fmtDate(s.monthsInfo.dueDate)}` : `Dépassé depuis ${fmtDate(s.monthsInfo.dueDate)}`));
    }
  }
  return metaParts;
}

function echeanceSub(type, s){
  if(s.level==='unknown') return 'jamais renseigné';
  if(s.estimated) return 'pas d\'historique';
  const parts = [];
  if(s.kmRemaining!=null && s.last){
    parts.push(s.kmRemaining>=0 ? `${s.kmRemaining.toLocaleString('fr-FR')} km restants` : `dépassé de ${Math.abs(s.kmRemaining).toLocaleString('fr-FR')} km`);
  }
  if(s.monthsInfo && (!parts.length || s.monthsInfo.daysRemaining<0)){
    parts.push(s.monthsInfo.daysRemaining>=0 ? `échéance ${fmtDate(s.monthsInfo.dueDate)}` : `dépassé depuis ${fmtDate(s.monthsInfo.dueDate)}`);
  }
  return parts.join(' · ');
}

function typeRowHtml(type, s, levelOverride){
  const detail = `
    <div class="det-meta">${typeMetaParts(type, s).map(p=>`<span>${escapeHtml(p)}</span>`).join('')}</div>
    ${type.rdvDate? `<div class="det-rdv">📅 RDV le ${fmtDate(type.rdvDate)}</div>` : ''}
    <div class="card-actions">
      <button class="small primary" onclick="openLogModal('${type.id}')">Marquer comme fait</button>
      <button class="ghost small" onclick="openTypeModal('${type.id}')">Modifier</button>
    </div>`;
  const level = levelOverride || s.level;
  return rowHtml({
    level, title: escapeHtml(type.name), sub: echeanceSub(type, s),
    badge: levelOverride ? LEVEL_STYLE[levelOverride].label : '',
    showBar: true, barRatio: (s.estimated || s.level==='unknown') ? 0 : s.ratio,
    detailHtml: detail
  });
}

function reminderRowHtml(r, statusKey){
  const today = new Date();
  let level = statusKey, sub = '';
  if(r.date){
    const daysLeft = daysBetween(today, new Date(r.date));
    sub = daysLeft<0 ? `dépassé (${Math.abs(daysLeft)} j)` : daysLeft===0 ? "aujourd'hui" : `${daysLeft} j restants`;
    if(daysLeft<0) level = 'priorite_haute'; else if(daysLeft<=30 && statusKey!=='priorite_haute') level = 'priorite_moyenne';
  }
  const detail = `
    <div class="det-meta"><span>${r.date? 'Échéance : '+fmtDate(r.date) : 'Pas de date fixée'}</span></div>
    ${r.rdvDate? `<div class="det-rdv">📅 RDV le ${fmtDate(r.rdvDate)}</div>` : ''}
    ${r.notes? `<div class="det-notes">${escapeHtml(r.notes)}</div>` : ''}
    <div class="card-actions">
      <button class="small primary" onclick="openValidateReminderModal('${r.id}')">Valider</button>
      <button class="ghost small" onclick="openReminderModal('${r.id}')">Modifier</button>
      <button class="ghost small" onclick="deleteReminder('${r.id}')">Supprimer</button>
    </div>`;
  return rowHtml({ level, title: escapeHtml(r.label), sub, badge: LEVEL_STYLE[statusKey].label, detailHtml: detail });
}

function collectData(){
  const reminders = state.reminders||[];
  const periodicTypes = state.types.filter(t=> t.intervalKm || t.intervalMonths);
  const statused = periodicTypes.map(type=> ({ type, s: computeStatus(type) }));
  const manual = statused.filter(x=> !!x.type.priority);
  const auto = statused.filter(x=> !x.type.priority);
  const countBy = key => reminders.filter(r=>(r.status||'estime')===key).length + manual.filter(x=>x.type.priority===key).length;
  const echeancesAVoir = auto.filter(x=> ['danger','warn','unknown'].includes(x.s.level)).length;
  const rdvItems = [];
  reminders.forEach(r=>{ if(r.rdvDate) rdvItems.push({ kind:'reminder', id:r.id, label:r.label, rdvDate:r.rdvDate, notes:r.notes }); });
  state.types.forEach(t=>{ if(t.rdvDate) rdvItems.push({ kind:'type', id:t.id, label:t.name, rdvDate:t.rdvDate, notes:null }); });
  rdvItems.sort((a,b)=> new Date(a.rdvDate)-new Date(b.rdvDate));
  return { reminders, statused, manual, auto, countBy, echeancesAVoir, rdvItems };
}

function renderKpisHtml(d){
  const today = new Date();
  const nextRdv = d.rdvItems.find(i=> daysBetween(today, new Date(i.rdvDate)) >= 0);
  const kpi = (value, label, color, onclick) => `
    <div class="kpi" onclick="${onclick}"><b style="color:${color}">${value}</b><small>${label}</small></div>`;
  return `<div class="kpis">
    ${kpi(d.countBy('priorite_haute'), 'Priorité haute', 'var(--danger)', "gotoTab('afaire','priorite_haute')")}
    ${kpi(d.countBy('priorite_moyenne'), 'Priorité moyenne', 'var(--warn)', "gotoTab('afaire','priorite_moyenne')")}
    ${kpi(d.echeancesAVoir, 'Échéances à voir', d.echeancesAVoir? 'var(--warn)':'var(--ok)', "gotoTab('echeances')")}
    ${kpi(nextRdv ? fmtDate(nextRdv.rdvDate) : 'Aucun', 'Prochain RDV', 'var(--text)', "gotoTab('afaire')")}
  </div>`;
}

function renderAFaireHtml(d){
  let html = '';
  const today = new Date();

  // RDV à venir
  if(d.rdvItems.length>0){
    let rows = '';
    d.rdvItems.forEach(item=>{
      const daysLeft = daysBetween(today, new Date(item.rdvDate));
      const level = daysLeft<0 ? 'priorite_haute' : daysLeft<=7 ? 'priorite_moyenne' : 'priorite_basse';
      const sub = daysLeft<0 ? `passé (${Math.abs(daysLeft)} j)` : daysLeft===0 ? "aujourd'hui" : daysLeft===1 ? 'demain' : `dans ${daysLeft} j`;
      const edit = item.kind==='reminder' ? `openReminderModal('${item.id}')` : `openTypeModal('${item.id}')`;
      rows += rowHtml({ level, title: escapeHtml(item.label), sub: `${fmtDate(item.rdvDate)} · ${sub}`,
        detailHtml: `${item.notes? `<div class="det-notes">${escapeHtml(item.notes)}</div>`:''}<div class="card-actions"><button class="ghost small" onclick="${edit}">Modifier</button></div>` });
    });
    html += `<div class="grp open"><div class="grp-head static"><span class="grp-title">🗓️ RDV à venir</span><span class="grp-count">${d.rdvItems.length}</span></div><div class="list">${rows}</div></div>`;
  }

  // Bannière relevé kilométrique
  const lastReport = lastMileageReportDate();
  const daysSinceReport = lastReport ? daysBetween(lastReport, new Date()) : null;
  if(daysSinceReport==null || daysSinceReport >= 30){
    const overdueDays = daysSinceReport!=null ? daysSinceReport - 30 : null;
    html += `
    <div class="card ${daysSinceReport==null || overdueDays>10 ? 'danger':'warn'}" style="margin:12px 0;">
      <div class="card-top"><div class="card-name">🔧 Relevé kilométrique mensuel</div><div class="card-status">${lastReport? 'À mettre à jour' : 'Manquant'}</div></div>
      <div class="card-meta"><span>${lastReport? `Dernier relevé le ${fmtDate(lastReport)} (${daysSinceReport} j) — indique le kilométrage actuel pour affiner les échéances` : "Aucun relevé enregistré — indique le kilométrage actuel"}</span></div>
    </div>`;
  }

  // Groupes par priorité
  const groups = [
    { key:'priorite_haute',   title:'Priorité haute' },
    { key:'priorite_moyenne', title:'Priorité moyenne' },
    { key:'priorite_basse',   title:'Priorité basse' },
    { key:'estime',           title:'Estimé (pas de date ni de priorité)' },
  ];
  if(d.countBy('priorite_haute')+d.countBy('priorite_moyenne')+d.countBy('priorite_basse')+d.countBy('estime')===0){
    html += `<div class="empty">Aucun rappel programmé.</div>`;
  }
  groups.forEach(g=>{
    const items = d.reminders.filter(r=>(r.status||'estime')===g.key).sort((a,b)=>{
      if(a.date && b.date) return new Date(a.date)-new Date(b.date);
      if(a.date) return -1; if(b.date) return 1; return 0; });
    const typeItems = d.manual.filter(x=>x.type.priority===g.key);
    const n = items.length + typeItems.length;
    if(n===0) return;
    let rows = '';
    typeItems.forEach(({type,s})=>{ rows += typeRowHtml(type, s, g.key); });
    items.forEach(r=>{ rows += reminderRowHtml(r, g.key); });
    html += groupHtml(g.key, g.title, n, LEVEL_STYLE[g.key].c, rows);
  });
  html += `<button class="fab-add" onclick="openReminderModal()">+ Ajouter un rappel de RDV</button>`;
  return html;
}

function renderEcheancesHtml(d){
  let html = `<div class="tab-note">Kilométrage actuel : <b>${state.currentMileage!=null? fmtKm(state.currentMileage) : 'non renseigné'}</b> · triées par urgence</div>`;
  const buckets = [
    { key:'e_danger',    lvl:'danger',    title:'En retard' },
    { key:'e_warn',      lvl:'warn',      title:'À prévoir bientôt' },
    { key:'e_unknown',   lvl:'unknown',   title:'Jamais vérifié / renseigné' },
    { key:'e_estimated', lvl:'estimated', title:'Estimé (aucun historique)' },
    { key:'e_ok',        lvl:'ok',        title:'À jour' },
  ];
  buckets.forEach(b=>{
    const items = d.auto.filter(x=>x.s.level===b.lvl).sort((a,c)=> c.s.ratio - a.s.ratio);
    if(items.length===0) return;
    let rows = '';
    items.forEach(({type,s})=>{ rows += typeRowHtml(type, s); });
    html += groupHtml(b.key, b.title, items.length, LEVEL_STYLE[b.lvl].c, rows);
  });
  if(d.manual.length>0){
    html += `<div class="tab-note" style="margin-top:12px;">${d.manual.length} échéance(s) suivie(s) avec une priorité manuelle sont dans l'onglet À faire.</div>`;
  }
  return html;
}

function renderJournalHtml(){
  let html = `<div class="section-title">✅ Journal d'entretien <small>historique — déjà fait</small></div>`;
  const sortedEntries = [...state.entries].sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(sortedEntries.length===0){
    html += `<div class="empty">Aucune intervention enregistrée pour l'instant.</div>`;
  } else {
    html += `<div class="cards">`;
    sortedEntries.forEach(e=>{
      html += `
      <div class="log-entry">
        <div class="log-left">
          <div class="log-type">${escapeHtml(e.typeName)}</div>
          <div class="log-sub">${fmtDate(e.date)}${e.mileage!=null? ' · '+fmtKm(e.mileage):''}</div>
          ${e.notes? `<div class="log-notes clamp" onclick="this.classList.toggle('open')">${escapeHtml(e.notes)}</div>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="log-cost">${e.cost? e.cost+' €':''}</div>
          <button class="ghost small" onclick="deleteEntry('${e.id}')">✕</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `<button class="fab-add" onclick="openLogModal(null)">+ Ajouter une intervention</button>`;
  html += `<button class="fab-add" style="margin-top:8px; background:transparent; color:var(--text-dim);" onclick="exportBackup()">⭳ Exporter la sauvegarde (.json)</button>`;
  html += `<button class="fab-add" style="margin-top:8px; background:transparent; color:var(--text-dim);" onclick="document.getElementById('importFileInput').click()">⭱ Importer une sauvegarde (.json)</button>`;
  html += `<input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="importBackup(event)">`;
  return html;
}

function render(){
  const app = document.getElementById('app');
  document.getElementById('odoInput').value = state.currentMileage ?? '';
  ['journal','afaire','echeances','carburant'].forEach(t=>{
    const b = document.getElementById('tab_'+t);
    if(b) b.classList.toggle('active', currentTab===t);
  });

  const lastPeriod = kmSinceLastPeriod();
  const sincePurchase = kmSincePurchase();
  const fStats = fuelStats();
  const plateStatsEl = document.getElementById('plateStats');
  if(plateStatsEl){
    plateStatsEl.innerHTML = `
    <div class="plate-stat">
      <div class="plate-stat-label">Km mois précédent</div>
      <div class="plate-stat-value">${lastPeriod ? lastPeriod.km.toLocaleString('fr-FR')+' km' : '—'}</div>
      <div class="plate-stat-sub">${lastPeriod ? `du ${fmtDate(lastPeriod.from)} au ${fmtDate(lastPeriod.to)}` : 'pas assez de relevés'}</div>
    </div>
    <div class="plate-stat">
      <div class="plate-stat-label">Km depuis l'achat</div>
      <div class="plate-stat-value">${sincePurchase!=null ? sincePurchase.toLocaleString('fr-FR')+' km' : '—'}</div>
      <div class="plate-stat-sub">depuis le ${fmtDate(PURCHASE_DATE)} (${PURCHASE_MILEAGE.toLocaleString('fr-FR')} km)</div>
    </div>
    <div class="plate-stat">
      <div class="plate-stat-label">Consommation moy.</div>
      <div class="plate-stat-value">${fStats ? fStats.avgConso.toFixed(1)+' L/100' : '—'}</div>
      <div class="plate-stat-sub">${fStats ? `sur ${fStats.count} pleins · ${fStats.totalKm.toLocaleString('fr-FR')} km` : 'ajoute au moins 2 pleins'}</div>
    </div>`;
  }

  if(currentTab==='carburant'){
    app.innerHTML = renderFuelTabHtml(fStats);
    return;
  }

  const d = collectData();
  let html = renderKpisHtml(d);
  if(currentTab==='afaire') html += renderAFaireHtml(d);
  else if(currentTab==='echeances') html += renderEcheancesHtml(d);
  else html += renderJournalHtml();
  app.innerHTML = html;
}

function switchTab(tab){
  currentTab = tab;
  render();
}

function renderFuelTabHtml(fStats){
  const entries = state.fuelEntries||[];
  const sortedByMileage = [...entries].filter(e=>e.mileage!=null).sort((a,b)=>a.mileage-b.mileage);
  const sortedByDateDesc = [...entries].sort((a,b)=> new Date(b.date)-new Date(a.date));

  let html = '';
  html += `<div class="section-title">⛽ Consommation carburant</div>`;

  if(fStats){
    html += `<div class="cards" style="margin-bottom:16px;">
      <div class="card ok">
        <div class="card-top">
          <div class="card-name">Moyenne générale</div>
          <div class="card-status">${fStats.avgConso.toFixed(1)} L/100km</div>
        </div>
        <div class="card-meta"><span>${fStats.count} pleins · ${fStats.totalKm.toLocaleString('fr-FR')} km · ${fStats.totalLiters.toFixed(1)} L cumulés</span></div>
      </div>
      ${fStats.lastConso!=null ? `
      <div class="card">
        <div class="card-top">
          <div class="card-name">Dernier plein</div>
          <div class="card-status">${fStats.lastConso.toFixed(1)} L/100km</div>
        </div>
      </div>`: ''}
    </div>`;
  } else {
    html += `<div class="empty" style="margin-bottom:16px;">Ajoute au moins deux pleins (avec kilométrage) pour voir apparaître la consommation.</div>`;
  }

  html += `<div class="section-title" style="font-size:12.5px; border-bottom:none; padding-bottom:0;">Historique des pleins</div>`;
  if(sortedByDateDesc.length===0){
    html += `<div class="cards"><div class="empty">Aucun plein enregistré.</div></div>`;
  } else {
    html += `<div class="cards">`;
    sortedByDateDesc.forEach(e=>{
      const conso = fuelConsoForEntry(e, sortedByMileage);
      const pricePerL = (e.cost!=null && e.liters) ? (e.cost/e.liters) : null;
      html += `
      <div class="card">
        <div class="card-top">
          <div class="card-name">${fmtDate(e.date)}</div>
          <div class="card-status">${conso!=null ? conso.toFixed(1)+' L/100km' : '—'}</div>
        </div>
        <div class="card-meta">
          <span>${fmtKm(e.mileage)}</span>
          <span>${e.liters!=null ? e.liters.toFixed(2)+' L' : '—'}</span>
          ${e.cost!=null ? `<span>${e.cost.toFixed(2)} €${pricePerL? ' ('+pricePerL.toFixed(3)+' €/L)':''}</span>` : ''}
        </div>
        ${e.notes? `<div class="card-meta" style="margin-top:4px;">${escapeHtml(e.notes)}</div>`: ''}
        <div class="card-actions">
          <button class="ghost small" onclick="openFuelModal('${e.id}')">Modifier</button>
          <button class="ghost small" onclick="deleteFuelEntry('${e.id}')">Supprimer</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `<button class="fab-add" style="margin-top:10px;" onclick="openFuelModal()">+ Ajouter un plein</button>`;
  return html;
}

  const e = id ? (state.fuelEntries||[]).find(x=>x.id===id) : null;
  const root = document.getElementById('modalRoot');
  const today = new Date().toISOString().slice(0,10);

  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>${e? 'Modifier le plein' : 'Nouveau plein'}</h3>
      <div class="field-row">
        <div class="field">
          <label>Date</label>
          <input id="f_date" type="date" value="${e? e.date : today}">
        </div>
        <div class="field">
          <label>Kilométrage</label>
          <input id="f_mileage" type="number" placeholder="${state.currentMileage ?? ''}" value="${e && e.mileage!=null? e.mileage : (state.currentMileage ?? '')}">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Litres</label>
          <input id="f_liters" type="number" step="0.01" placeholder="ex: 62.5" value="${e && e.liters!=null? e.liters : ''}">
        </div>
        <div class="field">
          <label>Coût total (€) <span style="opacity:.6;">(optionnel)</span></label>
          <input id="f_cost" type="number" step="0.01" placeholder="ex: 98.40" value="${e && e.cost!=null? e.cost : ''}">
        </div>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="f_notes" placeholder="Station, type de carburant…">${e? escapeHtml(e.notes||'') : ''}</textarea>
      </div>
      <div class="modal-actions">
        <button onclick="closeModal()">Annuler</button>

async function saveFuelEntry(id){
  const date = document.getElementById('f_date').value;
  const mileageVal = document.getElementById('f_mileage').value;
  const litersVal = document.getElementById('f_liters').value;
  const costVal = document.getElementById('f_cost').value;
  const notes = document.getElementById('f_notes').value.trim();
  if(!date || !mileageVal || !litersVal){ alert('Merci de renseigner au minimum la date, le kilométrage et les litres.'); return; }
  const mileage = parseInt(mileageVal,10);
  const liters = parseFloat(litersVal);
  const cost = costVal ? parseFloat(costVal) : null;

  state.fuelEntries = state.fuelEntries || [];
  if(id){
    const idx = state.fuelEntries.findIndex(x=>x.id===id);
    if(idx>-1) state.fuelEntries[idx] = { ...state.fuelEntries[idx], date, mileage, liters, cost, notes };
  } else {
    state.fuelEntries.push({ id:'f_'+Date.now(), date, mileage, liters, cost, notes });
  }
  if(state.currentMileage==null || mileage > state.currentMileage){
    state.currentMileage = mileage;
    recordMileage(date, mileage);
  }
  await saveState();
  closeModal();
  render();
}

async function deleteFuelEntry(id){
  if(!confirm('Supprimer ce plein ?')) return;
  state.fuelEntries = (state.fuelEntries||[]).filter(e=>e.id!==id);
  await saveState();
  render();
}

function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!confirm('Importer cette sauvegarde va remplacer toutes les données actuellement affichées. Continuer ?')) return;
      state = { ...state, ...parsed, types: parsed.types || DEFAULT_TYPES };
      state.reminders = (state.reminders||[]).map(r=> ({ status:'estime', ...r }));
      state.fuelEntries = state.fuelEntries || [];
      await saveState();
      render();
      alert('Sauvegarde importée avec succès.');
    }catch(err){
      alert("Fichier invalide : impossible de lire cette sauvegarde.");
      console.error(err);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `carnet-entretien-tj-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function saveTypeModal(id){
  const idx = state.types.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const name = document.getElementById('t_name').value.trim();
  const kmVal = document.getElementById('t_km').value;
  const monthsVal = document.getElementById('t_months').value;
  const priorityVal = document.getElementById('t_priority').value;
  const rdvDateVal = document.getElementById('t_rdvdate').value || null;
  if(!name){ alert('Merci de renseigner un intitulé.'); return; }
  state.types[idx] = {
    ...state.types[idx],
    name,
    intervalKm: kmVal ? parseInt(kmVal,10) : null,
    intervalMonths: monthsVal ? parseInt(monthsVal,10) : null,
    priority: priorityVal || null,
    rdvDate: rdvDateVal
  };
  // Garder la cohérence du typeName dans le journal si l'intitulé a changé
  state.entries = state.entries.map(e=> e.typeId===id ? { ...e, typeName: name } : e);
  await saveState();
  closeModal();
  render();
}

async function saveReminder(id){
  const label = document.getElementById('r_label').value.trim();
  const status = document.getElementById('r_status').value;
  const date = document.getElementById('r_date').value || null;
  const rdvDate = document.getElementById('r_rdvdate').value || null;
  const notes = document.getElementById('r_notes').value.trim();
  if(!label){ alert('Merci de renseigner un intitulé.'); return; }
  state.reminders = state.reminders || [];
  if(id){
    const idx = state.reminders.findIndex(r=>r.id===id);
    if(idx>-1) state.reminders[idx] = { ...state.reminders[idx], label, status, date, rdvDate, notes };
  } else {
    state.reminders.push({ id:'r_'+Date.now(), label, status, date, rdvDate, notes });
  }
  await saveState();
  closeModal();
  render();
}

async function deleteReminder(id){
  if(!confirm('Supprimer ce rappel ?')) return;
  state.reminders = (state.reminders||[]).filter(r=>r.id!==id);
  await saveState();
  render();
}

  const r = (state.reminders||[]).find(x=>x.id===id);

async function saveValidateReminder(id){
  const r = (state.reminders||[]).find(x=>x.id===id);
  if(!r) return;
  const date = document.getElementById('v_date').value;
  const mileageVal = document.getElementById('v_mileage').value;
  const costVal = document.getElementById('v_cost').value;
  const notes = document.getElementById('v_notes').value.trim();
  if(!date){ alert('Merci de renseigner une date.'); return; }

  const typeId = 'custom_' + r.label.toLowerCase().replace(/[^a-z0-9]+/g,'_');
  if(!state.types.find(t=>t.id===typeId)){
    state.types.push({ id: typeId, name: r.label, intervalKm:null, intervalMonths:null });
  }
  const entry = {
    id: 'e_' + Date.now(),
    typeId, typeName: r.label,
    date,
    mileage: mileageVal ? parseInt(mileageVal,10) : null,
    cost: costVal ? parseFloat(costVal) : null,
    notes
  };
  state.entries.push(entry);
  if(entry.mileage!=null && (state.currentMileage==null || entry.mileage > state.currentMileage)){
    state.currentMileage = entry.mileage;
    state.mileageHistory = state.mileageHistory || [];
    const existingSame = state.mileageHistory.find(h=>h.date===entry.date);
    if(existingSame){
      existingSame.mileage = Math.max(existingSame.mileage, entry.mileage);
    } else {
      state.mileageHistory.push({ date: entry.date, mileage: entry.mileage });
    }
  }
  state.reminders = (state.reminders||[]).filter(x=>x.id!==id);
  await saveState();
  closeModal();
  render();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

async function saveEntry(){
  const typeSel = document.getElementById('f_type').value;
  let typeId = typeSel, typeName;
  if(typeSel === '__custom__'){
    const customName = document.getElementById('f_customname').value.trim();
    if(!customName){ alert('Merci de nommer l\'intervention.'); return; }
    typeId = 'custom_' + customName.toLowerCase().replace(/[^a-z0-9]+/g,'_');
    typeName = customName;
    if(!state.types.find(t=>t.id===typeId)){
      state.types.push({ id: typeId, name: customName, intervalKm:null, intervalMonths:null });
    }
  } else {
    typeName = state.types.find(t=>t.id===typeId).name;
  }

  const date = document.getElementById('f_date').value;
  const mileageVal = document.getElementById('f_mileage').value;
  const costVal = document.getElementById('f_cost').value;
  const notes = document.getElementById('f_notes').value.trim();

  if(!date){ alert('Merci de renseigner une date.'); return; }

  const entry = {
    id: 'e_' + Date.now(),
    typeId, typeName,
    date,
    mileage: mileageVal ? parseInt(mileageVal,10) : null,
    cost: costVal ? parseFloat(costVal) : null,
    notes
  };
  state.entries.push(entry);
  if(entry.mileage!=null && (state.currentMileage==null || entry.mileage > state.currentMileage)){
    state.currentMileage = entry.mileage;
    state.mileageHistory = state.mileageHistory || [];
    const existingSame = state.mileageHistory.find(h=>h.date===entry.date);
    if(existingSame){
      existingSame.mileage = Math.max(existingSame.mileage, entry.mileage);
    } else {
      state.mileageHistory.push({ date: entry.date, mileage: entry.mileage });
    }
  }
  await saveState();
  closeModal();
  render();
}

async function deleteEntry(id){
  if(!confirm('Supprimer cette intervention du journal ?')) return;
  state.entries = state.entries.filter(e=>e.id!==id);
  await saveState();
  render();
}

document.getElementById('saveOdoBtn').addEventListener('click', async ()=>{
  const val = document.getElementById('odoInput').value;
  state.currentMileage = val ? parseInt(val,10) : null;
  if(state.currentMileage!=null){
    const todayStr = new Date().toISOString().slice(0,10);
    state.mileageHistory = state.mileageHistory || [];
    const existingToday = state.mileageHistory.find(h=>h.date===todayStr);
    if(existingToday){
      existingToday.mileage = state.currentMileage;
    } else {
      state.mileageHistory.push({ date: todayStr, mileage: state.currentMileage });
    }
  }
  await saveState();
  render();
});
