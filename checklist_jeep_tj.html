<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Checklist récupération Jeep TJ</title>
<style>
  :root {
    --bg: #14171c;
    --card: #1d2129;
    --card-border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa1ac;
    --accent: #d4602a;
    --accent-soft: rgba(212, 96, 42, 0.15);
    --ok: #4caf7d;
    --warn: #e0b23c;
    --danger: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header {
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.4em;
    margin: 0 0 4px 0;
    font-weight: 700;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.9em;
  }
  .progress-bar {
    height: 8px;
    background: var(--card-border);
    border-radius: 4px;
    overflow: hidden;
    margin: 14px 0 4px 0;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 0.8em;
    color: var(--text-dim);
    text-align: right;
  }
  .alert {
    background: rgba(217, 83, 79, 0.12);
    border: 1px solid rgba(217, 83, 79, 0.4);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 18px;
    font-size: 0.88em;
    line-height: 1.4;
  }
  .alert strong { color: var(--danger); }
  .section {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .section-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .section-title {
    font-weight: 600;
    font-size: 0.95em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-count {
    font-size: 0.78em;
    color: var(--text-dim);
    background: var(--card-border);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .chevron {
    color: var(--text-dim);
    transition: transform 0.2s ease;
    font-size: 0.8em;
  }
  .section.collapsed .chevron { transform: rotate(-90deg); }
  .section-body {
    padding: 0 16px 12px 16px;
  }
  .section.collapsed .section-body { display: none; }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--card-border);
    font-size: 0.9em;
    line-height: 1.35;
  }
  .item:first-child { border-top: none; }
  .item input[type="checkbox"] {
    margin-top: 2px;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .item label { cursor: pointer; flex: 1; }
  .item.checked label { color: var(--text-dim); text-decoration: line-through; }
  .tag {
    display: inline-block;
    font-size: 0.72em;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 8px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .tag-fred { background: rgba(224, 178, 60, 0.18); color: var(--warn); }
  .tag-priority { background: rgba(217, 83, 79, 0.18); color: var(--danger); }
  .note {
    display: block;
    font-size: 0.8em;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .reset-btn {
    display: block;
    margin: 22px auto 4px auto;
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.82em;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .item-main {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
  }
  .comment-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.95em;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }
  .comment-btn.has-comment { color: var(--accent); }
  .comment-btn:hover { color: var(--text); }
  .comment-box {
    display: none;
    margin-top: 8px;
    width: 100%;
  }
  .comment-box.open { display: flex; gap: 6px; align-items: flex-end; }
  .comment-box textarea {
    flex: 1;
    min-height: 34px;
    max-height: 120px;
    resize: vertical;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.85em;
    padding: 7px 9px;
  }
  .comment-box textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .mic-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 0.95em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mic-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .mic-btn.recording {
    color: #fff;
    background: var(--danger);
    border-color: var(--danger);
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(217, 83, 79, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(217, 83, 79, 0); }
    100% { box-shadow: 0 0 0 0 rgba(217, 83, 79, 0); }
  }
  .mic-unsupported {
    font-size: 0.72em;
    color: var(--text-dim);
    align-self: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚙 Récupération Jeep TJ — Jeudi</h1>
    <div class="subtitle">Fred, Sérignan (34) — Sahara 4.0L, 1997</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </header>

  <div class="alert">
    <strong>Rappel :</strong> contre-visite le mercredi matin, récupération jeudi quel que soit le résultat. Priorité absolue jeudi : facture frein AR + PV de contre-visite (dès disponible) + comportement au freinage à l'essai routier.
  </div>

  <div id="sections"></div>

  <button class="reset-btn" id="resetBtn">Réinitialiser la checklist</button>
</div>

<script>
const DATA = [
  {
    title: "📄 Documents à récupérer",
    items: [
      { id: "doc1", text: "Facture de réparation du frein arrière (nature exacte : garnitures / cylindres / réglage / purge)", tag: "fred" },
      { id: "doc2", text: "Facture de réparation échappement / silencieux", tag: "fred" },
      { id: "doc3", text: "PV de contre-visite validé (si disponible jeudi, sinon à réclamer)", tag: "priority" },
      { id: "doc4", text: "Carte grise du véhicule" },
      { id: "doc6", text: "Certificat de non-gage (certificat de situation administrative)", tag: "priority", note: "À demander daté de moins de 15 jours — vérifie l'absence de gage/opposition et le statut administratif du véhicule." },
      { id: "doc7", text: "Code de cession du véhicule", tag: "priority", note: "Transmis par Fred lors de la déclaration de cession — indispensable pour finaliser la démarche d'immatriculation en ligne (ANTS)." },
      { id: "doc5", text: "Carnet d'entretien si existant" }
    ]
  },
  {
    title: "🔧 Moteur froid puis chaud",
    items: [
      { id: "mot1", text: "Démarrage à froid : bruit, fumée à l'échappement" },
      { id: "mot2", text: "Niveaux huile moteur / liquide de refroidissement" },
      { id: "mot3", text: "Niveaux boîte de vitesses / boîte de transfert" },
      { id: "mot4", text: "Fuites visibles sous moteur / boîte / pont" }
    ]
  },
  {
    title: "🛣️ Essai routier",
    items: [
      { id: "rte1", text: "Enclenchement 4H / 4L" },
      { id: "rte2", text: "Transition 4H → 2H en manœuvre : écouter la boîte de transfert NP231 (fourchette, chaîne, dog clutches)" },
      { id: "rte3", text: "Test death wobble à 90–100 km/h sur route lisse" },
      { id: "rte4", text: "Tenue de route en ligne droite (lien avec jeu direction + ripage)", tag: "priority", note: "Ripage CT : +14,4 m/km, au-dessus du seuil habituel (~8 m/km max). Contrôle géométrie prévu chez un spécialiste 4x4 après achat — pas bloquant jeudi." },
      { id: "rte5", text: "Freinage à vitesse : tirage d'un côté, distance, bruit", tag: "priority", note: "Garnitures neuves pas encore rodées : mordant possiblement inégal les premiers km, à ne pas confondre avec un vrai déséquilibre résiduel." }
    ]
  },
  {
    title: "🔩 Dessous de caisse",
    items: [
      { id: "des1", text: "Longerons de châssis (rouille, chocs)" },
      { id: "des2", text: "Cardans avant / arrière" },
      { id: "des3", text: "Différentiels (jeu, fuites)" },
      { id: "des4", text: "Durites de frein (état, craquelures)" },
      { id: "des5", text: "Silent blocs des 4 points de suspension", note: "Déjà notés dégradés au CT (mineur) — à la charge de l'acheteur, priorité post-achat." },
      { id: "des6", text: "Usure des pneus (dents de scie sur les bords = signe de parallélisme à revoir)" }
    ]
  },
  {
    title: "🚪 Carrosserie",
    items: [
      { id: "car1", text: "Bas de caisse / seuils de porte (rouille, perforation)" },
      { id: "car2", text: "Plancher intérieur (sous tapis si possible)" },
      { id: "car3", text: "Configuration toit 1 (étanchéité, fixations)" },
      { id: "car4", text: "Configuration toit 2 (étanchéité, fixations)" }
    ]
  },
  {
    title: "🎛️ Direction / divers",
    items: [
      { id: "dir1", text: "Jeu de direction au point mort avant de tourner", note: "Noté mineur au CT — à re-tester." },
      { id: "dir2", text: "Bruits suspects généraux (habitacle, suspension) sur bosses" }
    ]
  }
];

const TAG_LABEL = { fred: "Fred", priority: "Priorité" };

function render() {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  DATA.forEach((section, sIdx) => {
    const secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.id = 'sec-' + sIdx;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <span class="section-title">${section.title}</span>
      <span style="display:flex; align-items:center; gap:8px;">
        <span class="section-count" id="count-${sIdx}"></span>
        <span class="chevron">▾</span>
      </span>
    `;
    header.addEventListener('click', () => {
      secEl.classList.toggle('collapsed');
    });

    const body = document.createElement('div');
    body.className = 'section-body';

    section.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item';
      row.id = 'row-' + item.id;
      const tagHtml = item.tag ? `<span class="tag tag-${item.tag}">${TAG_LABEL[item.tag]}</span>` : '';
      const noteHtml = item.note ? `<span class="note">${item.note}</span>` : '';
      row.innerHTML = `
        <div class="item-main">
          <input type="checkbox" id="chk-${item.id}">
          <label for="chk-${item.id}" style="flex:1;">${item.text}${tagHtml}${noteHtml}</label>
          <button class="comment-btn" id="cbtn-${item.id}" title="Ajouter un commentaire">💬</button>
        </div>
        <div class="comment-box" id="cbox-${item.id}">
          <textarea id="ctext-${item.id}" placeholder="Commentaire..."></textarea>
          <button class="mic-btn" id="mic-${item.id}" title="Dicter">🎤</button>
        </div>
      `;
      body.appendChild(row);
    });

    secEl.appendChild(header);
    secEl.appendChild(body);
    container.appendChild(secEl);
  });
}

function totalItems() {
  return DATA.reduce((sum, s) => sum + s.items.length, 0);
}

function updateProgress() {
  const total = totalItems();
  let checked = 0;
  DATA.forEach(section => {
    section.items.forEach(item => {
      if (document.getElementById('chk-' + item.id).checked) checked++;
    });
  });
  document.getElementById('progressFill').style.width = (total ? (checked/total*100) : 0) + '%';
  document.getElementById('progressLabel').textContent = `${checked} / ${total}`;

  DATA.forEach((section, sIdx) => {
    let c = 0;
    section.items.forEach(item => {
      if (document.getElementById('chk-' + item.id).checked) c++;
    });
    document.getElementById('count-' + sIdx).textContent = `${c}/${section.items.length}`;
  });
}

async function loadState() {
  try {
    const result = await window.storage.get('jeep-checklist-state');
    if (result && result.value) {
      const state = JSON.parse(result.value);
      const checks = state.checks || {};
      const comments = state.comments || {};
      Object.keys(checks).forEach(id => {
        const el = document.getElementById('chk-' + id);
        if (el) {
          el.checked = checks[id];
          el.closest('.item').classList.toggle('checked', checks[id]);
        }
      });
      Object.keys(comments).forEach(id => {
        const ta = document.getElementById('ctext-' + id);
        if (ta && comments[id]) {
          ta.value = comments[id];
          document.getElementById('cbox-' + id).classList.add('open');
          document.getElementById('cbtn-' + id).classList.add('has-comment');
        }
      });
    }
  } catch (e) {
    // no saved state yet
  }
  updateProgress();
}

async function saveState() {
  const checks = {};
  const comments = {};
  DATA.forEach(section => {
    section.items.forEach(item => {
      checks[item.id] = document.getElementById('chk-' + item.id).checked;
      const val = document.getElementById('ctext-' + item.id).value.trim();
      if (val) comments[item.id] = val;
    });
  });
  try {
    await window.storage.set('jeep-checklist-state', JSON.stringify({ checks, comments }));
  } catch (e) {
    console.error('Erreur de sauvegarde', e);
  }
}

function setupDictation(item) {
  const micBtn = document.getElementById('mic-' + item.id);
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognitionCtor) {
    micBtn.classList.add('mic-unsupported');
    micBtn.textContent = '🎤';
    micBtn.title = 'Dictée vocale non supportée par ce navigateur';
    micBtn.addEventListener('click', () => {
      alert("La dictée vocale n'est pas supportée par ce navigateur. Essaie avec Chrome ou Safari.");
    });
    return;
  }

  let recognition = null;
  let recording = false;

  micBtn.addEventListener('click', () => {
    if (recording) {
      recognition.stop();
      return;
    }
    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'fr-FR';
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onstart = () => {
      recording = true;
      micBtn.classList.add('recording');
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const ta = document.getElementById('ctext-' + item.id);
      ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + transcript;
      document.getElementById('cbtn-' + item.id).classList.add('has-comment');
      saveState();
    };
    recognition.onerror = () => {
      recording = false;
      micBtn.classList.remove('recording');
    };
    recognition.onend = () => {
      recording = false;
      micBtn.classList.remove('recording');
    };
    recognition.start();
  });
}

function attachHandlers() {
  DATA.forEach(section => {
    section.items.forEach(item => {
      const chk = document.getElementById('chk-' + item.id);
      chk.addEventListener('change', () => {
        chk.closest('.item').classList.toggle('checked', chk.checked);
        updateProgress();
        saveState();
      });

      const cbtn = document.getElementById('cbtn-' + item.id);
      const cbox = document.getElementById('cbox-' + item.id);
      cbtn.addEventListener('click', () => {
        cbox.classList.toggle('open');
      });

      const ctext = document.getElementById('ctext-' + item.id);
      ctext.addEventListener('input', () => {
        cbtn.classList.toggle('has-comment', ctext.value.trim().length > 0);
      });
      ctext.addEventListener('blur', saveState);

      setupDictation(item);
    });
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
    DATA.forEach(section => {
      section.items.forEach(item => {
        const chk = document.getElementById('chk-' + item.id);
        chk.checked = false;
        chk.closest('.item').classList.remove('checked');
        const ta = document.getElementById('ctext-' + item.id);
        ta.value = '';
        document.getElementById('cbox-' + item.id).classList.remove('open');
        document.getElementById('cbtn-' + item.id).classList.remove('has-comment');
      });
    });
    updateProgress();
    try {
      await window.storage.set('jeep-checklist-state', JSON.stringify({ checks: {}, comments: {} }));
    } catch (e) {}
  });
}

render();
attachHandlers();
loadState();
</script>
</body>
</html>
